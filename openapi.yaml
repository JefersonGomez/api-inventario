openapi: 3.0.3
info:
  title: "Inventario API"
  version: "3.6.0"
  description: |
    API REST del sistema de inventario (Stockly): productos, categorías, movimientos de stock,
    proveedores, solicitudes y órdenes de compra, reportes, auditoría, notificaciones,
    comentarios, asistente IA y datos de la empresa.

    **Autenticación**: `POST /auth/login` devuelve un `token` (JWT de acceso, corto) y un
    `refreshToken` (rotativo). Enviar el token como `Authorization: Bearer <token>`; cuando vence,
    pedir uno nuevo con `POST /auth/refresh`.

    **Multi-empresa**: cada dato pertenece a una empresa. El token lleva la empresa activa
    (`{ id, companyId }`) y todo se filtra por ella; un usuario puede estar en varias empresas
    (con un rol distinto en cada una) y cambia con `POST /auth/switch-company`.

    **Roles**: `ADMIN` y `EMPLOYE` (sin la segunda E), **por empresa** (se leen de la membresía en
    cada petición). Cada ruta indica qué rol necesita; sin el rol correcto la respuesta es 403.

    **Planes**: el plan del dueño (`BASIC`, `PRO`, `BUSINESS`) limita empresas, usuarios y productos.

    **Seguridad**: contraseñas nuevas de 8 a 72 caracteres, sin las más comunes (el login no aplica esta regla,
    para que las cuentas antiguas puedan entrar). El login permite 10 intentos fallidos por IP y correo cada
    15 minutos; registro e invitaciones, 20 peticiones por IP en el mismo plazo. Al pasarse responde **429**.
    Las fotos de perfil son JPEG, PNG o WEBP de hasta 5 MB y se valida su contenido real. Cuerpos JSON de hasta 100 KB.

    **Tiempo real**: además de esta API, el servidor expone Socket.IO en el mismo puerto
    (auth: `{ token }` en el handshake). Solo emite el evento `invalidate` con una lista de
    *topics* (p. ej. `["purchase-requests","notifications"]`) para que el cliente vuelva a pedir esos datos.
servers:
  - url: http://localhost:3000

tags:
  - name: Auth
  - name: Perfil
  - name: Usuarios
  - name: Empresa
  - name: Categorías
  - name: Productos
  - name: Movimientos
  - name: Proveedores
  - name: Solicitudes de compra
  - name: Órdenes de compra
  - name: Comentarios
  - name: Notificaciones
  - name: Reportes
  - name: Auditoría
  - name: Asistente
  - name: Plataforma
  - name: Sistema

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Datos inválidos (validación Zod o regla de negocio)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Falta el token o es inválido / vencido
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Autenticado pero sin el rol necesario
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    CompanySuspended:
      description: La empresa está suspendida (solo quedan disponibles /auth/me, /company, /companies, /profile/me y cambiar de empresa)
      content:
        application/json:
          schema:
            type: object
            properties:
              code: { type: string, example: COMPANY_SUSPENDED }
              error: { type: string, description: Motivo indicado al suspender }
    TooManyRequests:
      description: Demasiados intentos; espera unos minutos (cabecera `RateLimit-Reset`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: No existe (o el usuario no tiene acceso a ese recurso)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      description: "`error` puede ser un texto o la lista de issues de Zod"
      properties:
        error:
          oneOf:
            - type: string
            - type: array
              items: { type: object }
        message: { type: string }

    Role:
      type: string
      enum: [ADMIN, EMPLOYE]

    UserSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        avatarUrl: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        company: { type: string, nullable: true }
        isActive: { type: boolean }
        isPlatformOwner: { type: boolean, description: "true = dueño de la plataforma (solo en /profile/me)" }
        createdAt: { type: string, format: date-time }

    CompanyAccess:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        isOwner: { type: boolean }

    AuthResponse:
      type: object
      properties:
        token: { type: string, description: "JWT de acceso con { id, companyId }" }
        refreshToken: { type: string }
        user:
          allOf: [{ $ref: '#/components/schemas/User' }]
          description: "`role` = rol en la empresa activa"
        company: { $ref: '#/components/schemas/CompanyAccess' }
        companies:
          type: array
          items: { $ref: '#/components/schemas/CompanyAccess' }

    Company:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        currency: { type: string, enum: [CRC, USD], description: Moneda en la que se muestran los montos }
        suspendedAt: { type: string, format: date-time, nullable: true, description: "Fecha de suspensión (null = activa)" }
        suspensionReason: { type: string, nullable: true }
        ownerId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        plan: { type: string, enum: [BASIC, PRO, BUSINESS], description: Plan del dueño }
        limits:
          type: object
          properties:
            maxCompanies: { type: integer }
            maxUsersPerCompany: { type: integer, nullable: true }
            maxProducts: { type: integer, nullable: true, description: null = sin límite }

    Category:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }

    CategoryInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }

    SupplierSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    Supplier:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        address: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    SupplierInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string, format: email, description: "vacío (\"\") se acepta" }
        phone: { type: string }
        address: { type: string }

    Product:
      type: object
      properties:
        id: { type: string, format: uuid }
        sku: { type: string }
        barcode: { type: string, nullable: true }
        name: { type: string }
        description: { type: string, nullable: true }
        price: { type: string, description: "Precio de venta. Decimal(10,2) serializado como texto", example: "1250.00" }
        pendingReview: { type: boolean, description: "Importado sin precio (\"Por completar\"); se limpia al editarlo" }
        cost:
          type: string
          nullable: true
          description: "Costo promedio ponderado (Decimal(12,4) como texto). null = sin costo conocido. Se recalcula al recibir órdenes."
          example: "980.0000"
        stock: { type: integer }
        minStock: { type: integer }
        categoryId: { type: string, format: uuid }
        category: { $ref: '#/components/schemas/Category' }
        supplierId: { type: string, format: uuid, nullable: true }
        supplier:
          allOf: [{ $ref: '#/components/schemas/SupplierSummary' }]
          nullable: true
        expirationDate: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ProductCreateInput:
      type: object
      required: [sku, name, price, stock, minStock, categoryId]
      properties:
        sku: { type: string, minLength: 1 }
        barcode: { type: string }
        name: { type: string, minLength: 1 }
        description: { type: string }
        price: { type: number, exclusiveMinimum: true, minimum: 0 }
        cost: { type: number, minimum: 0, nullable: true, description: Costo inicial (opcional) }
        stock: { type: number, minimum: 0 }
        minStock: { type: number, minimum: 0 }
        categoryId: { type: string, format: uuid }
        expirationDate: { type: string, format: date }
        supplierId: { type: string, format: uuid, nullable: true }

    ProductUpdateInput:
      type: object
      description: El stock no se edita acá; cambia solo con movimientos u órdenes recibidas.
      required: [name, price, minStock, categoryId]
      properties:
        name: { type: string, minLength: 1 }
        barcode: { type: string }
        description: { type: string }
        price: { type: number, exclusiveMinimum: true, minimum: 0 }
        cost: { type: number, minimum: 0, nullable: true, description: "Omitido = no se toca; null = borra el costo" }
        minStock: { type: number, minimum: 0 }
        categoryId: { type: string, format: uuid }
        expirationDate: { type: string, format: date }
        supplierId: { type: string, format: uuid, nullable: true }

    ImportResult:
      type: object
      properties:
        dryRun: { type: boolean }
        created: { type: integer }
        updated: { type: integer }
        summary:
          type: object
          properties:
            total: { type: integer }
            toCreate: { type: integer }
            toUpdate: { type: integer }
            skipped: { type: integer }
            errors: { type: integer }
            pending: { type: integer, description: Filas que entran sin precio y quedan "Por completar" }
            fixed: { type: integer }
            newCategories: { type: array, items: { type: string } }
            newSuppliers: { type: array, items: { type: string } }
            groups:
              type: object
              description: Filas por tipo de problema (se cuentan aunque el arreglo esté activo)
              properties:
                missingCategory: { type: integer }
                missingSku: { type: integer }
                missingPrice: { type: integer }
                badNumbers: { type: integer }
                invalidDate: { type: integer }
                barcodeConflict: { type: integer }
                repeatedSku: { type: integer }
                existing: { type: integer }
        rows:
          type: array
          items:
            type: object
            properties:
              rowNumber: { type: integer }
              sku: { type: string }
              name: { type: string }
              status: { type: string, enum: [create, update, skip, error] }
              pending: { type: boolean }
              fixes: { type: array, items: { type: string }, description: Arreglos aplicados a la fila }
              errors: { type: array, items: { type: string } }

    MovementType:
      type: string
      enum: [IN, OUT, ADJUSTMENT]

    Movement:
      type: object
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/MovementType' }
        quantity: { type: integer }
        reason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        product: { $ref: '#/components/schemas/Product' }

    MovementInput:
      type: object
      required: [productId, type, quantity]
      properties:
        productId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/MovementType' }
        quantity: { type: number, exclusiveMinimum: true, minimum: 0 }
        reason: { type: string }

    PurchaseRequestStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]

    PurchaseRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        product: { $ref: '#/components/schemas/Product' }
        requestedById: { type: string, format: uuid }
        requestedBy: { $ref: '#/components/schemas/UserSummary' }
        quantity: { type: integer }
        reason: { type: string, nullable: true, description: Motivo de quien pide }
        status: { $ref: '#/components/schemas/PurchaseRequestStatus' }
        rejectionReason: { type: string, nullable: true, description: Motivo del admin al rechazar }
        expiresAt: { type: string, format: date-time, nullable: true }
        purchaseOrderId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }

    PurchaseRequestInput:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: string, format: uuid }
        quantity: { type: number, exclusiveMinimum: true, minimum: 0 }
        reason: { type: string }
        expiresAt: { type: string, format: date-time, description: "por defecto, 7 días" }

    PurchaseRequestStatusInput:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [APPROVED, REJECTED] }
        rejectionReason:
          type: string
          minLength: 1
          maxLength: 300
          description: Obligatorio si `status` es `REJECTED`; al aprobar se ignora y se borra.

    PurchaseOrderStatus:
      type: string
      enum: [PENDING, RECEIVED, CANCELLED]

    PurchaseOrder:
      type: object
      properties:
        id: { type: string, format: uuid }
        supplierId: { type: string, format: uuid }
        supplier: { $ref: '#/components/schemas/Supplier' }
        createdById: { type: string, format: uuid }
        createdBy:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        status: { $ref: '#/components/schemas/PurchaseOrderStatus' }
        createdAt: { type: string, format: date-time }
        receivedAt: { type: string, format: date-time, nullable: true }
        emailedAt: { type: string, format: date-time, nullable: true, description: Último envío al proveedor }
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              productId: { type: string, format: uuid }
              product: { $ref: '#/components/schemas/Product' }
              quantity: { type: integer }
              unitCost: { type: string, example: "980.00" }

    PurchaseOrderInput:
      type: object
      required: [supplierId, items]
      properties:
        supplierId: { type: string, format: uuid }
        items:
          type: array
          minItems: 1
          description: Sin productId repetidos entre líneas.
          items:
            type: object
            required: [productId, quantity, unitCost]
            properties:
              productId: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1 }
              unitCost: { type: number, exclusiveMinimum: true, minimum: 0 }
        fulfilledRequestIds:
          type: array
          description: Solicitudes aprobadas que esta orden cubre
          items: { type: string, format: uuid }

    Comment:
      type: object
      properties:
        id: { type: string, format: uuid }
        body: { type: string }
        authorId: { type: string, format: uuid }
        author:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            avatarUrl: { type: string, nullable: true }
        purchaseRequestId: { type: string, format: uuid, nullable: true }
        purchaseOrderId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }

    CommentInput:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 1000 }

    Notification:
      type: object
      properties:
        id: { type: string, description: "uuid si es guardada; id derivado (p. ej. `product-lowstock-<id>`) si es calculada" }
        type:
          type: string
          description: >
            Calculadas (solo ADMIN): requestExpiring, pending, approved, productExpiring, lowStock.
            Guardadas: requestApproved, requestRejected, orderReceived, requestComment, orderComment.
        title: { type: string }
        meta: { type: object, additionalProperties: true }
        link: { type: string, description: Ruta del frontend a la que lleva el aviso }
        createdAt: { type: string, format: date-time, nullable: true }
        persisted: { type: boolean }
        read: { type: boolean }

    AuditLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        user: { $ref: '#/components/schemas/UserSummary' }
        action:
          type: string
          enum: [CREATE, UPDATE, DELETE, APPROVE, REJECT, RECEIVE, ACTIVATE, DEACTIVATE, EMAIL]
        entityType: { type: string, example: PurchaseOrder }
        entityId: { type: string }
        changes: { type: object, nullable: true, additionalProperties: true }
        createdAt: { type: string, format: date-time }

paths:
  # ---------------------------------------------------------------- Sistema
  /health:
    get:
      tags: [Sistema]
      summary: Estado del servidor
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  # ---------------------------------------------------------------- Auth
  /auth/register:
    post:
      tags: [Auth]
      summary: Crear cuenta + su primera empresa (queda como ADMIN y dueño)
      description: Los empleados no se registran solos; el admin de cada empresa los agrega. `company` = nombre de la empresa.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, acceptTerms]
              properties:
                name: { type: string, minLength: 1 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 72, description: Sin las contraseñas más comunes }
                phone: { type: string, maxLength: 30 }
                company: { type: string, maxLength: 120 }
                acceptTerms: { type: boolean, enum: [true], description: Obligatoria. Aceptación de los términos y la política de privacidad (se guarda con fecha y versión). }
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 1, description: "Sin la política de contraseñas nueva (cuentas antiguas pueden tener 6 caracteres)" }
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Renovar el token de acceso
      description: El refresh token es rotativo; el anterior queda revocado.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: Tokens nuevos
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  refreshToken: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Cerrar sesión (revoca el refresh token)
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
      responses:
        '204': { description: Sesión cerrada }

  /auth/switch-company:
    post:
      tags: [Auth]
      summary: Cambiar la empresa activa
      description: Devuelve tokens nuevos para esa empresa. 403 si el usuario no está activo en ella.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [companyId]
              properties:
                companyId: { type: string, format: uuid }
      responses:
        '200':
          description: Nueva sesión
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /auth/me:
    get:
      tags: [Auth]
      summary: Datos del token actual
      responses:
        '200':
          description: Payload del JWT
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      companyId: { type: string, format: uuid }
                      role: { $ref: '#/components/schemas/Role' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------------------------------------------------------- Perfil
  /profile/me:
    get:
      tags: [Perfil]
      summary: Ver mi perfil
      responses:
        '200':
          description: Perfil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Perfil]
      summary: Editar nombre y email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name: { type: string, minLength: 1 }
                email: { type: string, format: email }
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /profile/me/avatar:
    post:
      tags: [Perfil]
      summary: Subir foto de perfil
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar: { type: string, format: binary }
      responses:
        '200':
          description: Perfil con el nuevo `avatarUrl` (servido desde `/uploads/avatars/...`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /profile/me/password:
    put:
      tags: [Perfil]
      summary: Cambiar contraseña
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, minLength: 1 }
                newPassword: { type: string, minLength: 8, maxLength: 72, description: Sin las contraseñas más comunes }
      responses:
        '200': { description: Contraseña cambiada }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------------------------------------------------------- Usuarios
  /users:
    get:
      tags: [Usuarios]
      summary: Usuarios de la empresa activa (ADMIN)
      responses:
        '200':
          description: Usuarios
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /users/{id}/toggle-active:
    patch:
      tags: [Usuarios]
      summary: Activar / desactivar un usuario en la empresa activa (ADMIN)
      description: Corta su acceso a esta empresa al instante (sus otras empresas no cambian). No se puede desactivar al dueño ni a uno mismo.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Usuario con el nuevo `isActive`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- Empresa
  /company:
    get:
      tags: [Empresa]
      summary: Empresa activa (con plan y límites)
      responses:
        '200':
          description: Empresa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Empresa]
      summary: Cambiar el nombre y/o la moneda de la empresa (ADMIN)
      description: Al menos uno de los dos campos. Cambiar la moneda solo cambia cómo se muestran los montos; no convierte valores.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                currency: { type: string, enum: [CRC, USD] }
      responses:
        '200':
          description: Empresa actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /companies:
    get:
      tags: [Empresa]
      summary: Empresas en las que estoy activo
      responses:
        '200':
          description: Empresas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CompanyAccess' }
    post:
      tags: [Empresa]
      summary: Crear otra empresa (quedo como dueño y ADMIN)
      description: Límite = `maxCompanies` del plan. Para entrar a ella, `POST /auth/switch-company`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                currency: { type: string, enum: [CRC, USD], default: CRC }
      responses:
        '201':
          description: Empresa creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyAccess' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /invitations:
    get:
      tags: [Usuarios]
      summary: Invitaciones pendientes de la empresa activa (ADMIN)
      responses:
        '200':
          description: Pendientes (sin aceptar, sin anular y sin vencer)
          content:
            application/json:
              schema:
                type: array
                items: { type: object, additionalProperties: true }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Usuarios]
      summary: Invitar a alguien a la empresa (ADMIN)
      description: |
        Devuelve el `link` (con el token) **solo esta vez**; vence en 7 días. Invitar de nuevo al mismo email
        anula la anterior. Usuarios activos + invitaciones pendientes no pueden pasar `maxUsersPerCompany` del plan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                role: { type: string, enum: [ADMIN, EMPLOYE], default: EMPLOYE }
      responses:
        '201':
          description: Invitación creada
          content:
            application/json:
              schema:
                type: object
                properties:
                  link: { type: string, example: "http://localhost:5173/invite/<token>" }
                  invitation: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /invitations/{id}:
    delete:
      tags: [Usuarios]
      summary: Anular una invitación pendiente (ADMIN)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Anulada }
        '404': { $ref: '#/components/responses/NotFound' }

  /invitations/token/{token}:
    get:
      tags: [Usuarios]
      summary: Ver una invitación por su link (público)
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Datos para mostrar en la página del link
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [valid, expired, revoked, accepted] }
                  email: { type: string }
                  role: { type: string, enum: [ADMIN, EMPLOYE] }
                  company: { type: string }
                  invitedBy: { type: string }
                  expiresAt: { type: string, format: date-time }
                  userExists: { type: boolean, description: "true = entra con su contraseña; false = crea cuenta" }
        '404': { $ref: '#/components/responses/NotFound' }

  /invitations/token/{token}/accept:
    post:
      tags: [Usuarios]
      summary: Aceptar una invitación (público)
      description: Cuenta nueva = `name` + `password`; cuenta existente = su `password`. Devuelve la sesión ya abierta en esa empresa.
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                name: { type: string }
                password: { type: string, minLength: 6 }
                acceptTerms: { type: boolean, description: Obligatoria (true) solo si la invitación crea una cuenta nueva }
      responses:
        '200':
          description: Sesión
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ---------------------------------------------------------------- Plataforma
  /platform/companies:
    get:
      tags: [Plataforma]
      summary: Todas las empresas de la plataforma (solo dueño de la plataforma)
      description: |
        Nombre, dueño, plan, uso y estado. **Nunca** devuelve datos de inventario de los clientes.
        El dueño de la plataforma se marca solo con `npm run owner -- correo` (no hay endpoint).
      responses:
        '200':
          description: Empresas, de la más reciente a la más antigua
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    name: { type: string }
                    currency: { type: string, enum: [CRC, USD] }
                    createdAt: { type: string, format: date-time }
                    suspendedAt: { type: string, format: date-time, nullable: true }
                    suspensionReason: { type: string, nullable: true }
                    owner:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        email: { type: string }
                    plan: { type: string, enum: [BASIC, PRO, BUSINESS] }
                    limits: { type: object, additionalProperties: true }
                    users: { type: integer, description: Miembros activos }
                    products: { type: integer, description: Productos no eliminados }
        '403': { $ref: '#/components/responses/Forbidden' }

  /platform/companies/{id}/plan:
    patch:
      tags: [Plataforma]
      summary: Cambiar el plan del dueño de la empresa (solo dueño de la plataforma)
      description: El plan es de la cuenta del dueño, así que aplica a todas sus empresas. Queda en la auditoría.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan]
              properties:
                plan: { type: string, enum: [BASIC, PRO, BUSINESS] }
      responses:
        '204': { description: Plan cambiado }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /platform/companies/{id}/suspension:
    patch:
      tags: [Plataforma]
      summary: Suspender o reactivar una empresa (solo dueño de la plataforma)
      description: |
        Con la empresa suspendida, sus usuarios pueden iniciar sesión pero toda ruta de datos responde
        **403 `COMPANY_SUSPENDED`** con el motivo. No se borra nada. Queda en la auditoría.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [suspended]
              properties:
                suspended: { type: boolean }
                reason: { type: string, maxLength: 300, description: Lo ve la empresa }
      responses:
        '204': { description: Estado cambiado }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- Categorías
  /categories:
    get:
      tags: [Categorías]
      summary: Listar categorías
      responses:
        '200':
          description: Categorías (sin las eliminadas)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Categorías]
      summary: Crear categoría (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '201':
          description: Creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /categories/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Categorías]
      summary: Ver una categoría
      responses:
        '200':
          description: Categoría
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Categorías]
      summary: Editar categoría (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '200':
          description: Actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Categorías]
      summary: Eliminar categoría (ADMIN, soft delete)
      responses:
        '200': { description: Eliminada }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- Productos
  /products:
    get:
      tags: [Productos]
      summary: Listar productos
      responses:
        '200':
          description: Productos (sin los eliminados)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Product' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Productos]
      summary: Crear producto (ADMIN)
      description: Falla con 400 si se alcanzó `maxProducts` del plan.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductCreateInput' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /products/import:
    post:
      tags: [Productos]
      summary: Importar productos desde Excel (ADMIN)
      description: |
        El frontend lee el .xlsx y manda las filas. Con `dryRun: true` solo valida y devuelve la vista previa.
        Reglas: una categoría o proveedor que no existe se crea; solo se importan las filas válidas; respeta el
        límite de productos del plan (las actualizaciones no cuentan). Sin `options` es estricto: cualquier dato
        faltante o inválido es error y un SKU existente se salta. `options` activa arreglos en bloque; un SKU
        existente con `updateExisting` actualiza solo los campos que trae (nunca el stock) y deja auditoría.
        Hasta 2000 filas (esta ruta acepta cuerpos de hasta 2 MB).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rows, dryRun]
              properties:
                dryRun: { type: boolean }
                options:
                  type: object
                  properties:
                    defaultCategory: { type: string, maxLength: 100, description: Categoría para filas sin categoría }
                    generateSku: { type: boolean, description: SKU automático IMP-0001… para filas sin SKU }
                    pendingPrice: { type: boolean, description: Sin precio válido → precio 0 y marca pendingReview }
                    fixNumbers: { type: boolean, description: Redondea stock, negativos a 0, quita costo inválido }
                    ignoreInvalidDate: { type: boolean }
                    dropConflictingBarcode: { type: boolean }
                    skipRepeated: { type: boolean, description: SKU repetido en el archivo → se usa la primera fila }
                    updateExisting: { type: boolean }
                rows:
                  type: array
                  minItems: 1
                  maxItems: 2000
                  items:
                    type: object
                    required: [rowNumber]
                    properties:
                      rowNumber: { type: integer, description: Fila del Excel (para reportar errores) }
                      sku: { type: string }
                      name: { type: string }
                      category: { type: string }
                      price: { type: number }
                      cost: { type: number }
                      stock: { type: integer }
                      minStock: { type: integer }
                      barcode: { type: string }
                      description: { type: string }
                      supplier: { type: string }
                      expirationDate: { type: string, example: "2027-03-31" }
      responses:
        '200':
          description: Vista previa (dryRun)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportResult' }
        '201':
          description: Importación hecha
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /products/expiring-soon:
    get:
      tags: [Productos]
      summary: Productos que vencen pronto
      parameters:
        - name: days
          in: query
          schema: { type: integer, default: 7 }
      responses:
        '200':
          description: Productos con `expirationDate` dentro del plazo
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Product' }

  /products/barcode/{code}:
    get:
      tags: [Productos]
      summary: Buscar producto por código de barras
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Producto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404': { $ref: '#/components/responses/NotFound' }

  /products/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Productos]
      summary: Ver un producto
      responses:
        '200':
          description: Producto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/BadRequest' }
    put:
      tags: [Productos]
      summary: Editar producto (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductUpdateInput' }
      responses:
        '200':
          description: Actualizado (un cambio de precio queda en el historial)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Productos]
      summary: Eliminar producto (ADMIN, soft delete)
      responses:
        '200': { description: Eliminado }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /products/{id}/price-history:
    get:
      tags: [Productos]
      summary: Historial de precios del producto
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Cambios de precio, del más reciente al más antiguo
          content:
            application/json:
              schema:
                type: array
                items: { type: object, additionalProperties: true }

  # ---------------------------------------------------------------- Movimientos
  /movements:
    get:
      tags: [Movimientos]
      summary: Listar movimientos de stock
      parameters:
        - name: productId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Movimientos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Movement' }
    post:
      tags: [Movimientos]
      summary: Registrar entrada, salida o ajuste (ADMIN, EMPLOYE)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MovementInput' }
      responses:
        '201':
          description: Movimiento creado; el stock del producto se actualiza
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Movement' }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ---------------------------------------------------------------- Proveedores
  /suppliers:
    get:
      tags: [Proveedores]
      summary: Listar proveedores
      responses:
        '200':
          description: Proveedores
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Supplier' }
    post:
      tags: [Proveedores]
      summary: Crear proveedor (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplierInput' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Supplier' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /suppliers/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Proveedores]
      summary: Ver un proveedor
      responses:
        '200':
          description: Proveedor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Supplier' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Proveedores]
      summary: Editar proveedor (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplierInput' }
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Supplier' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Proveedores]
      summary: Eliminar proveedor (ADMIN)
      responses:
        '200': { description: Eliminado }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- Solicitudes de compra
  /purchase-requests:
    get:
      tags: [Solicitudes de compra]
      summary: Listar solicitudes
      description: ADMIN ve todas; EMPLOYE solo las suyas.
      responses:
        '200':
          description: Solicitudes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PurchaseRequest' }
    post:
      tags: [Solicitudes de compra]
      summary: Crear solicitud (cualquier usuario)
      description: Aprobarla no sube stock; solo autoriza la compra.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseRequestInput' }
      responses:
        '201':
          description: Creada (estado PENDING)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /purchase-requests/alerts:
    get:
      tags: [Solicitudes de compra]
      summary: Alertas de solicitudes (ADMIN)
      responses:
        '200':
          description: Por vencer, aprobadas sin orden y productos por vencer
          content:
            application/json:
              schema:
                type: object
                properties:
                  expiringSoon:
                    type: array
                    items: { $ref: '#/components/schemas/PurchaseRequest' }
                  approvedUnfulfilled:
                    type: array
                    items: { $ref: '#/components/schemas/PurchaseRequest' }
                  expiringSoonProducts:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /purchase-requests/{id}/status:
    patch:
      tags: [Solicitudes de compra]
      summary: Aprobar o rechazar (ADMIN)
      description: Avisa a quien la pidió (campanita + socket) si el estado cambió.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseRequestStatusInput' }
      responses:
        '200':
          description: Solicitud actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /purchase-requests/{id}/comments:
    parameters: [{ $ref: '#/components/parameters/Id' }]
