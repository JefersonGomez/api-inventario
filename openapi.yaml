      tags: [Comentarios]
      summary: Hilo de comentarios de una solicitud
      description: Quien pidió la solicitud y los ADMIN. Otro empleado recibe 404.
      responses:
        '200':
          description: Comentarios en orden cronológico
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Comment' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Comentarios]
      summary: Comentar en una solicitud
      description: Avisa a los ADMIN activos y a quien la pidió (menos al autor). Sin edición ni borrado.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentInput' }
      responses:
        '201':
          description: Comentario creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Órdenes de compra
  /purchase-orders:
    get:
      tags: [Órdenes de compra]
      summary: Listar órdenes
      responses:
        '200':
          description: Órdenes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PurchaseOrder' }
    post:
      tags: [Órdenes de compra]
      summary: Crear orden (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseOrderInput' }
      responses:
        '201':
          description: Creada (estado PENDING)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /purchase-orders/{id}:
    get:
      tags: [Órdenes de compra]
      summary: Ver una orden
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Orden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '404': { $ref: '#/components/responses/NotFound' }

  /purchase-orders/{id}/receive:
    patch:
      tags: [Órdenes de compra]
      summary: Marcar como recibida (ADMIN)
      description: Recepción completa (no parcial). Sube el stock con movimientos IN y avisa a quien pidió cada solicitud vinculada.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Orden recibida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /purchase-orders/{id}/send-email:
    post:
      tags: [Órdenes de compra]
      summary: Enviar (o reenviar) la orden al email del proveedor (ADMIN)
      description: |
        Usa Resend. Sin `EMAIL_FROM` configurado (sin dominio verificado) funciona en **modo prueba**:
        el correo va a `EMAIL_TEST_TO` y el asunto indica el destinatario real.
        Falla con 400 si el proveedor no tiene email o falta el nombre de la empresa.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Enviado
          content:
            application/json:
              schema:
                type: object
                properties:
                  order: { $ref: '#/components/schemas/PurchaseOrder' }
                  testMode: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /purchase-orders/{id}/comments:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Comentarios]
      summary: Hilo de comentarios de una orden (ADMIN)
      responses:
        '200':
          description: Comentarios en orden cronológico
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Comment' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Comentarios]
      summary: Comentar en una orden (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentInput' }
      responses:
        '201':
          description: Comentario creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- Notificaciones
  /notifications:
    get:
      tags: [Notificaciones]
      summary: Avisos de la campanita
      description: |
        ADMIN: avisos calculados (stock bajo, por vencer, pendientes, aprobadas sin orden) + sus avisos guardados.
        EMPLOYE: solo sus avisos guardados. Los calculados siempre cuentan como no leídos.
      responses:
        '200':
          description: Avisos
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  unread: { type: integer }
                  notifications:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }

  /notifications/read-all:
    patch:
      tags: [Notificaciones]
      summary: Marcar todos mis avisos guardados como leídos
      responses:
        '200':
          description: Cantidad marcada
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: integer }

  /notifications/{id}/read:
    patch:
      tags: [Notificaciones]
      summary: Marcar un aviso guardado como leído
      description: Solo afecta avisos del propio usuario (`updated` = 0 si es ajeno o ya estaba leído).
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Cantidad marcada
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: integer }

  # ---------------------------------------------------------------- Reportes
  /reports/low-stock:
    get:
      tags: [Reportes]
      summary: Productos con stock en o bajo el mínimo
      responses:
        '200':
          description: Productos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Product' }

  /reports/movements:
    get:
      tags: [Reportes]
      summary: Movimientos por rango de fechas
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Movimientos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Movement' }

  /reports/inventory-value:
    get:
      tags: [Reportes]
      summary: Valor del inventario a costo
      description: |
        `totalValue` = stock × costo promedio de los productos activos (lo que hay invertido).
        Los productos con stock y sin costo no suman: se cuentan en `productsWithoutCost`.
      responses:
        '200':
          description: Totales
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalValue: { type: number, description: Valor a costo }
                  retailValue: { type: number, description: "Valor a precio de venta (referencia)" }
                  totalProducts: { type: integer }
                  productsWithoutCost: { type: integer, description: Productos con stock y sin costo cargado }

  /reports/inventory-value-breakdown:
    get:
      tags: [Reportes]
      summary: Capital activo vs. inmovilizado (a costo)
      parameters:
        - name: days
          in: query
          description: Días sin movimiento para considerar un producto inmovilizado
          schema: { type: integer, default: 60 }
      responses:
        '200':
          description: Desglose
          content:
            application/json:
              schema:
                type: object
                properties:
                  daysThreshold: { type: integer }
                  totalValue: { type: number }
                  activeValue: { type: number }
                  immobilizedValue: { type: number }
                  productsWithoutCost: { type: integer }
                  immobilizedProducts:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        sku: { type: string }
                        name: { type: string }
                        value: { type: number, description: Valor a costo (0 si no tiene costo) }
                        hasCost: { type: boolean }

  /reports/stock-forecast:
    get:
      tags: [Reportes]
      summary: Pronóstico de agotamiento según el ritmo de ventas
      parameters:
        - name: velocityDays
          in: query
          description: Ventana para calcular las ventas diarias
          schema: { type: integer, default: 30 }
        - name: alertDays
          in: query
          description: Umbral de días restantes para marcarlo urgente
          schema: { type: integer, default: 14 }
      responses:
        '200':
          description: Pronóstico
          content:
            application/json:
              schema:
                type: object
                properties:
                  velocityWindowDays: { type: integer }
                  forecast:
                    type: array
                    items:
                      type: object
                      properties:
                        productId: { type: string, format: uuid }
                        productName: { type: string }
                        currentStock: { type: integer }
                        dailyVelocity: { type: number }
                        daysRemaining: { type: number, nullable: true }
                        willRunOutSoon: { type: boolean }
                  urgent:
                    type: array
                    items: { type: object, additionalProperties: true }

  # ---------------------------------------------------------------- Auditoría
  /audit-logs:
    get:
      tags: [Auditoría]
      summary: Registro de auditoría (ADMIN, últimos 200)
      parameters:
        - name: entityType
          in: query
          schema: { type: string, example: PurchaseOrder }
        - name: action
          in: query
          description: "Ej.: `EMAIL` para ver solo los correos enviados a proveedores"
          schema: { type: string }
      responses:
        '200':
          description: Registros, del más reciente al más antiguo
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditLog' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /audit-logs/metrics:
    get:
      tags: [Auditoría]
      summary: Métricas de auditoría (ADMIN)
      responses:
        '200':
          description: Métricas
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalCount: { type: integer }
                  byAction:
                    type: array
                    items:
                      type: object
                      properties:
                        action: { type: string }
                        count: { type: integer }
                  byEntityType:
                    type: array
                    items:
                      type: object
                      properties:
                        entityType: { type: string }
                        count: { type: integer }
                  recentActivity:
                    type: array
                    description: Fechas de cada acción de los últimos 7 días (el cliente las agrupa por día local)
                    items: { type: string, format: date-time }
                  emails:
                    type: object
                    properties:
                      total: { type: integer }
                      testMode: { type: integer }
                      last:
                        type: object
                        nullable: true
                        properties:
                          createdAt: { type: string, format: date-time }
                          changes:
                            type: object
                            properties:
                              to: { type: string }
                              testMode: { type: boolean }
                          user:
                            type: object
                            properties:
                              name: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- Asistente
  /assistant/chat:
    post:
      tags: [Asistente]
      summary: Preguntar al asistente IA (solo lectura)
      description: Usa Gemini con herramientas de consulta; nunca crea, edita ni borra datos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '200':
          description: Respuesta del asistente
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
