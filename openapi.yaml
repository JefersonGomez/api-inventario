openapi: 3.0.3
info:
  title: "Inventario API"
  version: "3.6.0"
  description: |
    API REST del sistema de inventario (Stockly): productos, categorías, movimientos de stock,
    proveedores, solicitudes y órdenes de compra, reportes, auditoría, notificaciones,
    comentarios, asistente IA y datos de la empresa.

    **Autenticación**: `POST /auth/login` devuelve un `token` (JWT de acceso, corto) y un
    `refreshToken` (rotativo). Enviar el token como `Authorization: Bearer <token>`; cuando vence,
    pedir uno nuevo con `POST /auth/refresh`.

    **Multi-empresa**: cada dato pertenece a una empresa. El token lleva la empresa activa
    (`{ id, companyId }`) y todo se filtra por ella; un usuario puede estar en varias empresas
    (con un rol distinto en cada una) y cambia con `POST /auth/switch-company`.

    **Roles y permisos**: 5 roles fijos **por empresa** (se leen de la membresía en cada petición):
    `ADMIN` (Administrador, todo), `MANAGER` (Encargado), `EMPLOYE` (Bodega, sin la segunda E),
    `CASHIER` (Cajero) y `ACCOUNTANT` (Contador). Cada rol trae un juego de permisos
    (`GET /users/permissions`) y a cada persona se le pueden dar o quitar permisos sueltos
    (`PATCH /users/{id}/access`). Cada ruta indica el permiso que pide; sin él la respuesta es 403.
    Sin `costs.view`, **ninguna** respuesta incluye `cost` ni `unitCost` (se quitan antes de enviar).
    **Código de caja**: quien abre caja (`cash.manage`) o autoriza (`sales.discount`, `sales.void`) tiene un código
    de 4 a 6 dígitos. Lo asigna el administrador (o el encargado, para los cajeros) con `POST /users/{id}/pin`, elegido
    o al azar, y a la persona le llega un aviso. Vence a los `cashCodeDays` días de la empresa (30 por defecto); vencido
    no sirve hasta renovarlo. La persona puede cambiarlo (`PUT /profile/me/pin`) y después queda fijo hasta que vence,
    salvo que el admin le asigne otro. Con el de quien autoriza se aprueba en la pantalla de otro (`POST /authorizations`).

    **Planes**: el plan del dueño (`BASIC`, `PRO`, `BUSINESS`) limita empresas; sucursales, cajas, usuarios y
    productos se cuentan **por empresa** (las bodegas no tienen límite).

    **Lotes**: los productos con `tracksLots` llevan su stock por lote (código + vencimiento) en cada ubicación. Toda
    entrada pide `lot` (movimiento, stock inicial, recepción de orden); las salidas toman primero el que vence antes
    (FEFO) y el movimiento guarda en `lots` de cuáles salió. En una transferencia los lotes viajan; el sobrante de un
    conteo entra a "SIN-LOTE". Al activar `tracksLots` el stock que ya había pasa a un lote "INICIAL". Avisos por lote.

    **Ubicaciones (sucursales y bodegas)**: el stock se lleva por ubicación; `Product.stock` es el total. Cada empresa
    nace con su "Sucursal principal" (código 001). La persona trabaja en las ubicaciones que le asigna el admin
    (`PATCH /users/{id}/access` → `locationIds`; vacío = todas; el ADMIN, todas) y elige en cuál está con el
    encabezado **`X-Location-Id`** (si no es una de las suyas se ignora; con una sola asignada, esa es siempre la activa).
    Con ubicación activa (o si solo trabaja en algunas), productos, movimientos y reportes muestran solo lo de ahí;
    sin ella, los totales. Movimientos, stock inicial, importación y órdenes de compra aceptan `locationId`
    (sin indicarlo: la ubicación activa).

    **Seguridad**: contraseñas nuevas de 8 a 72 caracteres, sin las más comunes (el login no aplica esta regla,
    para que las cuentas antiguas puedan entrar). El login permite 10 intentos fallidos por IP y correo cada
    15 minutos; registro e invitaciones, 20 peticiones por IP en el mismo plazo. Al pasarse responde **429**.
    Las fotos de perfil son JPEG, PNG o WEBP de hasta 5 MB y se valida su contenido real. Cuerpos JSON de hasta 100 KB.

    **Tiempo real**: además de esta API, el servidor expone Socket.IO en el mismo puerto
    (auth: `{ token }` en el handshake). Solo emite el evento `invalidate` con una lista de
    *topics* (p. ej. `["purchase-requests","notifications"]`) para que el cliente vuelva a pedir esos datos.
servers:
  - url: http://localhost:3000

tags:
  - name: Auth
  - name: Perfil
  - name: Usuarios
  - name: Empresa
  - name: Categorías
  - name: Productos
  - name: Movimientos
  - name: Proveedores
  - name: Clientes
  - name: Punto de venta
  - name: Cuentas por cobrar
  - name: Cuentas por pagar
  - name: Bancos
  - name: Ventas
  - name: Productos base
  - name: Solicitudes de compra
  - name: Órdenes de compra
  - name: Comentarios
  - name: Notificaciones
  - name: Reportes
  - name: Auditoría
  - name: Asistente
  - name: Plataforma
  - name: Sistema

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Q:
      name: q
      in: query
      description: Texto a buscar (sin distinguir mayúsculas)
      schema: { type: string, maxLength: 100 }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Datos inválidos (validación Zod o regla de negocio)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Falta el token o es inválido / vencido
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Autenticado pero sin el rol necesario
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    CompanySuspended:
      description: La empresa está suspendida (solo quedan disponibles /auth/me, /company, /companies, /profile/me y cambiar de empresa)
      content:
        application/json:
          schema:
            type: object
            properties:
              code: { type: string, example: COMPANY_SUSPENDED }
              error: { type: string, description: Motivo indicado al suspender }
    TooManyRequests:
      description: Demasiados intentos; espera unos minutos (cabecera `RateLimit-Reset`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: No existe (o el usuario no tiene acceso a ese recurso)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    DiscountPick:
      type: object
      required: [typeId]
      properties:
        typeId: { type: string, format: uuid }
        value: { type: number, minimum: 0.01, description: "Solo en los tipos libres: % o monto que escribe el cajero" }
    DiscountTypeInput:
      type: object
      required: [name, kind, value]
      properties:
        name: { type: string, maxLength: 60 }
        kind: { type: string, enum: [PERCENT, AMOUNT] }
        value: { type: number, nullable: true, description: "null = libre (el cajero escribe cuánto)" }
        maxPercent: { type: number, nullable: true, maximum: 100, description: "Tope de los libres" }
        appliesTo: { type: string, enum: [LINE, TOTAL, BOTH], default: BOTH }
        isActive: { type: boolean, default: true }
    PageMeta:
      type: object
      description: "Respuesta de un listado paginado: { items, total, page, pageSize, pageCount }"
      properties:
        items: { type: array, items: { type: object } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        pageCount: { type: integer }

    Error:
      type: object
      description: "`error` puede ser un texto o la lista de issues de Zod"
      properties:
        error:
          oneOf:
            - type: string
            - type: array
              items: { type: object }
        message: { type: string }

    Role:
      type: string
      enum: [ADMIN, MANAGER, EMPLOYE, CASHIER, ACCOUNTANT]

    Permission:
      type: string
      enum: [products.manage, costs.view, stock.move, purchases.request, purchases.manage, suppliers.manage,
        customers.manage, customers.delete, reports.view, audit.view, users.manage, company.manage,
        sales.sell, cash.manage, sales.discount, sales.void, accounting.view]

    UserSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        avatarUrl: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        company: { type: string, nullable: true }
        isActive: { type: boolean }
        grantedPermissions: { type: array, items: { $ref: '#/components/schemas/Permission' }, description: "Dados además del rol (solo en /users)" }
        revokedPermissions: { type: array, items: { $ref: '#/components/schemas/Permission' }, description: "Quitados al rol (solo en /users)" }
        hasPin: { type: boolean, description: "Tiene código de caja (solo en /users)" }
        needsPin: { type: boolean, description: "Abre caja o autoriza: necesita código (solo en /users)" }
        isPlatformOwner: { type: boolean, description: "true = dueño de la plataforma (solo en /profile/me)" }
        createdAt: { type: string, format: date-time }

    CompanyAccess:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        isOwner: { type: boolean }

    AuthResponse:
      type: object
      properties:
        token: { type: string, description: "JWT de acceso con { id, companyId }" }
        refreshToken: { type: string }
        user:
          allOf: [{ $ref: '#/components/schemas/User' }]
          description: "`role` = rol en la empresa activa"
        company: { $ref: '#/components/schemas/CompanyAccess' }
        companies:
          type: array
          items: { $ref: '#/components/schemas/CompanyAccess' }

    Company:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        currency: { type: string, enum: [CRC, USD], description: Moneda en la que se muestran los montos }
        cashCodeDays: { type: integer, minimum: 7, maximum: 365, description: Días que dura un código de caja (30 por defecto) }
        posShowStock: { type: boolean }
        returnDays: { type: integer, minimum: 1, maximum: 365, description: Días para devolver una venta (30 por defecto) }
        requirePaymentRef: { type: boolean, description: "Tarjeta y SINPE exigen la referencia (true por defecto)" }
        sinpeNumber: { type: string, nullable: true, description: "SINPE Móvil general, 8 dígitos (cada sucursal puede tener el suyo)" }
        sinpeName: { type: string, nullable: true }
        legalName: { type: string, nullable: true, description: Razón social o nombre de la persona física }
        idType: { $ref: '#/components/schemas/IdType' }
        idNumber: { type: string, nullable: true, description: Sin guiones }
        economicActivity: { type: string, nullable: true, description: Código de actividad económica ante Hacienda }
        invoiceEmail: { type: string, nullable: true, description: Correo que aparece en los comprobantes }
        phone: { type: string, nullable: true }
        province: { type: string, nullable: true, enum: ['1', '2', '3', '4', '5', '6', '7', null], description: "Código Hacienda: 1 San José, 2 Alajuela, 3 Cartago, 4 Heredia, 5 Guanacaste, 6 Puntarenas, 7 Limón" }
        canton: { type: string, nullable: true, pattern: '^\d{2}$' }
        district: { type: string, nullable: true, pattern: '^\d{2}$' }
        addressDetail: { type: string, nullable: true, description: Otras señas }
        suspendedAt: { type: string, format: date-time, nullable: true, description: "Fecha de suspensión (null = activa)" }
        suspensionReason: { type: string, nullable: true }
        ownerId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        plan: { type: string, enum: [BASIC, PRO, BUSINESS], description: Plan del dueño }
        limits:
          type: object
          properties:
            maxCompanies: { type: integer }
            maxBranches: { type: integer, nullable: true }
            maxRegistersPerBranch: { type: integer, nullable: true, description: Cajas (Bloque 7) }
            maxUsersPerCompany: { type: integer, nullable: true }
            maxProducts: { type: integer, nullable: true, description: null = sin límite }

    Location:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [BRANCH, WAREHOUSE], description: "Sucursal (vende) o bodega (solo almacena)" }
        code: { type: string, nullable: true, description: "Sucursales: 3 dígitos para los comprobantes" }
        address: { type: string, nullable: true }
        isActive: { type: boolean }

    LotInput:
      type: object
      description: Productos con lotes (tracksLots). En las salidas no hace falta (se toma primero el que vence antes).
      required: [code]
      properties:
        code: { type: string, minLength: 1, maxLength: 40 }
        expiresAt: { type: string, format: date-time, nullable: true, description: "null = sin vencimiento conocido (sale de último)" }

    LotMove:
      type: object
      properties:
        code: { type: string }
        expiresAt: { type: string, format: date-time, nullable: true }
        quantity: { type: number }

    StockCount:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [OPEN, CLOSED, CANCELLED] }
        location: { type: object, properties: { id: { type: string }, name: { type: string } } }
        category: { type: object, nullable: true, properties: { id: { type: string }, name: { type: string } } }
        notes: { type: string, nullable: true }
        createdBy: { $ref: '#/components/schemas/UserSummary' }
        closedBy: { allOf: [{ $ref: '#/components/schemas/UserSummary' }], nullable: true, type: object }
        createdAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time, nullable: true }
        items:
          type: array
          items:
            type: object
            properties:
              productId: { type: string, format: uuid }
              product: { type: object, properties: { id: { type: string }, name: { type: string }, sku: { type: string }, barcode: { type: string, nullable: true }, unit: { type: string }, cost: { type: number, nullable: true } } }
              countedQuantity: { type: number, nullable: true, description: null = sin contar }
              systemQuantity: { type: number, nullable: true, description: Lo que decía el sistema al contarlo }
              currentQuantity: { type: number, description: Lo que dice el sistema ahora en esa ubicación }
              countedAt: { type: string, format: date-time, nullable: true }

    StockTransfer:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [IN_TRANSIT, RECEIVED, CANCELLED] }
        fromLocation: { $ref: '#/components/schemas/Location' }
        toLocation: { $ref: '#/components/schemas/Location' }
        notes: { type: string, nullable: true }
        sentBy: { $ref: '#/components/schemas/UserSummary' }
        receivedBy: { allOf: [{ $ref: '#/components/schemas/UserSummary' }], nullable: true, type: object }
        sentAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time, nullable: true, description: Recibida o cancelada }
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              productId: { type: string, format: uuid }
              quantity: { type: number, description: Enviado }
              receivedQuantity: { type: number, nullable: true, description: "Lo que llegó; la diferencia es faltante" }
              product: { type: object, properties: { id: { type: string }, name: { type: string }, sku: { type: string }, unit: { type: string } } }

    LocationInput:
      type: object
      required: [name, type]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        type: { type: string, enum: [BRANCH, WAREHOUSE] }
        address: { type: string, nullable: true, maxLength: 250 }

    Category:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }

    CategoryInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }

    SupplierSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    IdType:
      type: string
      nullable: true
      enum: [FISICA, JURIDICA, DIMEX, NITE, EXTRANJERO, null]
      description: "Física 9 dígitos, jurídica y NITE 10, DIMEX 11 o 12, extranjero hasta 20 letras/números. Tipo y número van juntos; el número se guarda sin guiones."

    Supplier:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        address: { type: string, nullable: true }
        idType: { $ref: '#/components/schemas/IdType' }
        idNumber: { type: string, nullable: true }
        creditDays: { type: integer }
        createdAt: { type: string, format: date-time }

    SupplierInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string, format: email, description: "vacío (\"\") se acepta" }
        phone: { type: string }
        address: { type: string }
        idType: { $ref: '#/components/schemas/IdType' }
        idNumber: { type: string, nullable: true }
        creditDays: { type: integer, minimum: 0, maximum: 365, description: "Días de crédito que da el proveedor (0 = contado; ausente = 0)" }

    InvoiceTaxLines:
      type: array
      minItems: 1
      maxItems: 5
      description: "Una fila por tarifa; lo exento no lleva IVA"
      items:
        type: object
        required: [rate, base]
        properties:
          rate: { type: string, enum: [RATE_13, RATE_4, RATE_2, RATE_1, EXEMPT] }
          base: { type: number, minimum: 0, description: "Sin IVA" }
          tax: { type: number, minimum: 0, description: "Si no viene: base × tarifa" }

    BankAccountInput:
      type: object
      required: [name, bankName, currency]
      properties:
        name: { type: string, maxLength: 60 }
        bankName: { type: string, maxLength: 60 }
        number: { type: string, maxLength: 34, description: IBAN }
        currency: { type: string, enum: [CRC, USD] }
        isActive: { type: boolean }
        general: { type: boolean, description: "Recibe el SINPE general y la tarjeta de las sucursales sin cuenta propia" }
        locationIds: { type: array, items: { type: string, format: uuid }, description: "Sucursales cuyo SINPE y tarjeta caen en esta cuenta" }

    Customer:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        idType: { $ref: '#/components/schemas/IdType' }
        idNumber: { type: string, nullable: true }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        address: { type: string, nullable: true }
        economicActivity: { type: string, nullable: true }
        creditLimit: { type: number, nullable: true, description: null = cliente de contado }
        creditDays: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CustomerInput:
      type: object
      required: [name]
      description: Crear y editar mandan el cliente completo ("" o ausente = sin dato). La identificación es única por empresa entre los clientes activos.
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        idType: { $ref: '#/components/schemas/IdType' }
        idNumber: { type: string, nullable: true }
        email: { type: string, format: email, nullable: true }
        phone: { type: string, nullable: true }
        address: { type: string, nullable: true }
        economicActivity: { type: string, nullable: true }

    ProductGroup:
      type: object
      description: Producto base que agrupa variantes. Cada variante es un Product normal con groupId y sus atributos.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        attributeNames: { type: array, items: { type: string }, example: [Talla, Color] }
        _count: { type: object, properties: { products: { type: integer, description: Variantes activas } } }

    ProductGroupInput:
      type: object
      required: [name, attributeNames]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        attributeNames: { type: array, minItems: 1, maxItems: 5, items: { type: string, maxLength: 40 }, description: "Sin repetidos. No se puede quitar un atributo que usan variantes activas." }

    Product:
      type: object
      properties:
        id: { type: string, format: uuid }
        sku: { type: string }
        barcode: { type: string, nullable: true }
        name: { type: string }
        description: { type: string, nullable: true }
        price: { type: number, description: "Precio de venta CON IVA incluido (precio de góndola)", example: 1250 }
        unit: { $ref: '#/components/schemas/UnitOfMeasure' }
        taxRate: { $ref: '#/components/schemas/TaxRate' }
        cabys: { type: string, nullable: true, pattern: '^\d{13}$', description: Código CABYS (13 dígitos) }
        groupId: { type: string, format: uuid, nullable: true, description: Producto base si es una variante }
        group:
          type: object
          nullable: true
          properties: { id: { type: string }, name: { type: string }, attributeNames: { type: array, items: { type: string } } }
        attributes: { type: object, nullable: true, additionalProperties: { type: string }, example: { Talla: M, Color: Rojo } }
        pendingReview: { type: boolean, description: "Importado sin precio (\"Por completar\"); se limpia al editarlo" }
        cost:
          type: number
          nullable: true
          description: "Costo promedio ponderado. null = sin costo conocido. Se recalcula al recibir órdenes."
          example: 980
        stock: { type: number, description: "Hasta 3 decimales; entero si unit = UNIT" }
        minStock: { type: number }
        categoryId: { type: string, format: uuid }
        category: { $ref: '#/components/schemas/Category' }
        supplierId: { type: string, format: uuid, nullable: true }
        supplier:
          type: object
          allOf: [{ $ref: '#/components/schemas/SupplierSummary' }]
          nullable: true
        expirationDate: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ProductCreateInput:
      type: object
      required: [sku, name, price, stock, minStock, categoryId]
      properties:
        locationId: { type: string, format: uuid, description: "Dónde entra el stock inicial (sin indicar, la ubicación activa)" }
        tracksLots: { type: boolean, description: "Maneja lotes con vencimiento (alimentos, medicinas...)" }
        lot: { $ref: '#/components/schemas/LotInput' }
        sku: { type: string, minLength: 1 }
        barcode: { type: string }
        name: { type: string, minLength: 1 }
        description: { type: string }
        price: { type: number, exclusiveMinimum: true, minimum: 0 }
        cost: { type: number, minimum: 0, nullable: true, description: Costo inicial (opcional) }
        stock: { type: number, minimum: 0, description: "Stock inicial: entra como movimiento IN con origen INITIAL. Entero si unit = UNIT; máx. 3 decimales" }
        minStock: { type: number, minimum: 0 }
        unit: { $ref: '#/components/schemas/UnitOfMeasure' }
        taxRate: { $ref: '#/components/schemas/TaxRate' }
        cabys: { type: string, nullable: true, pattern: '^\d{13}$' }
        groupId: { type: string, format: uuid, nullable: true, description: "Variante: un valor por cada atributo del producto base, sin repetir la combinación de otra variante" }
        attributes: { type: object, nullable: true, additionalProperties: { type: string } }
        categoryId: { type: string, format: uuid }
        expirationDate: { type: string, format: date }
        supplierId: { type: string, format: uuid, nullable: true }

    ProductUpdateInput:
      type: object
      description: El stock no se edita acá; cambia solo con movimientos u órdenes recibidas.
      required: [name, price, minStock, categoryId]
      properties:
        name: { type: string, minLength: 1 }
        barcode: { type: string }
        description: { type: string }
        price: { type: number, exclusiveMinimum: true, minimum: 0 }
        cost: { type: number, minimum: 0, nullable: true, description: "Omitido = no se toca; null = borra el costo" }
        minStock: { type: number, minimum: 0 }
        unit: { $ref: '#/components/schemas/UnitOfMeasure', description: "No se puede pasar a UNIT si el stock actual tiene decimales" }
        taxRate: { $ref: '#/components/schemas/TaxRate' }
        cabys: { type: string, nullable: true, pattern: '^\d{13}$', description: "Omitido = no se toca; null o vacío = lo borra" }
        groupId: { type: string, format: uuid, nullable: true, description: "Omitido = no se toca la variante; null = deja de ser variante" }
        attributes: { type: object, nullable: true, additionalProperties: { type: string } }
        categoryId: { type: string, format: uuid }
        expirationDate: { type: string, format: date }
        supplierId: { type: string, format: uuid, nullable: true }

    UnitOfMeasure:
      type: string
      enum: [UNIT, KG, G, L, ML, M, CM, M2]
      default: UNIT
      description: "Unidad de medida (códigos de Hacienda: Unid, kg, g, L, mL, m, cm, m²). UNIT solo admite cantidades enteras."

    TaxRate:
      type: string
      enum: [EXEMPT, RATE_1, RATE_2, RATE_4, RATE_13]
      default: RATE_13
      description: Tarifa de IVA del producto (el precio la incluye)

    MovementSource:
      type: string
      enum: [MANUAL, INITIAL, PURCHASE_RECEIPT, SALE, RETURN, COUNT, TRANSFER]
      description: "Origen del movimiento; con sourceId apunta al documento (p. ej. la orden en PURCHASE_RECEIPT)"

    ImportResult:
      type: object
      properties:
        dryRun: { type: boolean }
        created: { type: integer }
        updated: { type: integer }
        summary:
          type: object
          properties:
            total: { type: integer }
            toCreate: { type: integer }
            toUpdate: { type: integer }
            skipped: { type: integer }
            errors: { type: integer }
            pending: { type: integer, description: Filas que entran sin precio y quedan "Por completar" }
            fixed: { type: integer }
            newCategories: { type: array, items: { type: string } }
            newSuppliers: { type: array, items: { type: string } }
            groups:
              type: object
              description: Filas por tipo de problema (se cuentan aunque el arreglo esté activo)
              properties:
                missingCategory: { type: integer }
                missingSku: { type: integer }
                missingPrice: { type: integer }
                badNumbers: { type: integer }
                invalidDate: { type: integer }
                barcodeConflict: { type: integer }
                repeatedSku: { type: integer }
                existing: { type: integer }
                badFiscal: { type: integer, description: "Unidad, IVA o CABYS no reconocidos" }
        rows:
          type: array
          items:
            type: object
            properties:
              rowNumber: { type: integer }
              sku: { type: string }
              name: { type: string }
              status: { type: string, enum: [create, update, skip, error] }
              pending: { type: boolean }
              fixes: { type: array, items: { type: string }, description: Arreglos aplicados a la fila }
              errors: { type: array, items: { type: string } }

    MovementType:
      type: string
      enum: [IN, OUT, ADJUSTMENT]

    Movement:
      type: object
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/MovementType' }
        quantity: { type: number }
        reason: { type: string, nullable: true }
        source: { $ref: '#/components/schemas/MovementSource' }
        sourceId: { type: string, nullable: true }
        locationId: { type: string, format: uuid }
        location: { type: object, properties: { id: { type: string }, name: { type: string }, type: { type: string } } }
        lots: { type: array, nullable: true, items: { $ref: '#/components/schemas/LotMove' }, description: Productos con lotes; una salida puede tocar varios }
        createdAt: { type: string, format: date-time }
        product: { $ref: '#/components/schemas/Product' }

    MovementInput:
      type: object
      required: [productId, type, quantity]
      properties:
        productId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/MovementType' }
        quantity: { type: number, exclusiveMinimum: true, minimum: 0, description: "En ADJUSTMENT: la cantidad contada en ESA ubicación" }
        reason: { type: string }
        locationId: { type: string, format: uuid, description: "Sin indicar: la ubicación activa. OUT falla si no alcanza en esa ubicación" }
        lot: { $ref: '#/components/schemas/LotInput' }

    PurchaseRequestStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]

    PurchaseRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        product: { $ref: '#/components/schemas/Product' }
        requestedById: { type: string, format: uuid }
        requestedBy: { $ref: '#/components/schemas/UserSummary' }
        quantity: { type: number, description: "Hasta 3 decimales; entero si el producto es por unidad" }
        reason: { type: string, nullable: true, description: Motivo de quien pide }
        status: { $ref: '#/components/schemas/PurchaseRequestStatus' }
        rejectionReason: { type: string, nullable: true, description: Motivo del admin al rechazar }
        expiresAt: { type: string, format: date-time, nullable: true }
        purchaseOrderId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }

    PurchaseRequestInput:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: string, format: uuid }
        quantity: { type: number, exclusiveMinimum: true, minimum: 0 }
        reason: { type: string }
        expiresAt: { type: string, format: date-time, description: "por defecto, 7 días" }

    PurchaseRequestStatusInput:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [APPROVED, REJECTED] }
        rejectionReason:
          type: string
          minLength: 1
          maxLength: 300
          description: Obligatorio si `status` es `REJECTED`; al aprobar se ignora y se borra.

    PurchaseOrderStatus:
      type: string
      enum: [PENDING, PARTIAL, RECEIVED, CLOSED, CANCELLED]
      description: "PARTIAL = llegó una parte; CLOSED = cerrada con lo pendiente cancelado; CANCELLED = cancelada sin recibir nada"

    PurchaseOrder:
      type: object
      properties:
        id: { type: string, format: uuid }
        supplierId: { type: string, format: uuid }
        supplier: { $ref: '#/components/schemas/Supplier' }
        createdById: { type: string, format: uuid }
        createdBy:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        status: { $ref: '#/components/schemas/PurchaseOrderStatus' }
        createdAt: { type: string, format: date-time }
        receivedAt: { type: string, format: date-time, nullable: true }
        emailedAt: { type: string, format: date-time, nullable: true, description: Último envío al proveedor }
        locationId: { type: string, format: uuid, description: A dónde entra la mercadería al recibirla }
        cancelReason: { type: string, nullable: true, description: Motivo al cancelar o cerrar }
        location: { type: object, properties: { id: { type: string }, name: { type: string } } }
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              productId: { type: string, format: uuid }
              product: { $ref: '#/components/schemas/Product' }
              quantity: { type: number, description: Pedido }
              receivedQuantity: { type: number, description: Suma de lo recibido en todas las recepciones }
              unitCost: { type: string, example: "980.00" }

    PurchaseOrderInput:
      type: object
      required: [supplierId, items]
      properties:
        supplierId: { type: string, format: uuid }
        locationId: { type: string, format: uuid, description: "A dónde entra al recibirla (sin indicar, la ubicación activa)" }
        items:
          type: array
          minItems: 1
          description: Sin productId repetidos entre líneas.
          items:
            type: object
            required: [productId, quantity, unitCost]
            properties:
              productId: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1 }
              unitCost: { type: number, exclusiveMinimum: true, minimum: 0 }
        fulfilledRequestIds:
          type: array
          description: Solicitudes aprobadas que esta orden cubre
          items: { type: string, format: uuid }

    Comment:
      type: object
      properties:
        id: { type: string, format: uuid }
        body: { type: string }
        authorId: { type: string, format: uuid }
        author:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            avatarUrl: { type: string, nullable: true }
        purchaseRequestId: { type: string, format: uuid, nullable: true }
        purchaseOrderId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }

    CommentInput:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 1000 }

    Notification:
      type: object
      properties:
        id: { type: string, description: "uuid si es guardada; id derivado (p. ej. `product-lowstock-<id>`) si es calculada" }
        type:
          type: string
          description: >
            Calculadas (solo con purchases.manage): requestExpiring, pending, approved, productExpiring, lowStock.
            Calculadas para quien tiene código de caja: cashCodeExpiring (últimos 5 días), cashCodeExpired.
            Para el dueño de la plataforma: aiBudgetAlert (guardada).
            Guardadas: requestApproved, requestRejected, orderReceived, requestComment, orderComment, cashCodeAssigned,
            transferIncoming (a quienes reciben en el destino), transferReceived (a quien envió; meta.shortages).
        title: { type: string }
        meta: { type: object, additionalProperties: true }
        link: { type: string, description: Ruta del frontend a la que lleva el aviso }
        createdAt: { type: string, format: date-time, nullable: true }
        persisted: { type: boolean }
        read: { type: boolean }

    AuditLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        user: { $ref: '#/components/schemas/UserSummary' }
        action:
          type: string
          enum: [CREATE, UPDATE, DELETE, APPROVE, REJECT, RECEIVE, ACTIVATE, DEACTIVATE, EMAIL]
        entityType: { type: string, example: PurchaseOrder }
        entityId: { type: string }
        changes: { type: object, nullable: true, additionalProperties: true }
        createdAt: { type: string, format: date-time }

paths:
  # ---------------------------------------------------------------- Sistema
  /health:
    get:
      tags: [Sistema]
      summary: Estado del servidor
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  # ---------------------------------------------------------------- Auth
  /auth/register:
    post:
      tags: [Auth]
      summary: Crear cuenta + su primera empresa (queda como ADMIN y dueño)
      description: Los empleados no se registran solos; el admin de cada empresa los agrega. `company` = nombre de la empresa.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, acceptTerms]
              properties:
                name: { type: string, minLength: 1 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 72, description: Sin las contraseñas más comunes }
                phone: { type: string, maxLength: 30 }
                company: { type: string, maxLength: 120 }
                acceptTerms: { type: boolean, enum: [true], description: Obligatoria. Aceptación de los términos y la política de privacidad (se guarda con fecha y versión). }
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /auth/demo:
    get:
      tags: [Auth]
      summary: ¿Está activa la demo pública? (DEMO_ENABLED=1) y los códigos de caja que muestra
      security: []
      responses:
        '200': { description: "{ enabled: false } o { enabled: true, codes: { cashier, manager } }" }
    post:
      tags: [Auth]
      summary: Entrar a la demo sin contraseña como su administrador o su cajero
      description: "Solo con DEMO_ENABLED=1 (si no, 404). Devuelve lo mismo que /auth/login. Las cuentas demo (User.isDemo) no pueden cambiar su correo ni se les cambian código o accesos (403). La empresa demo (Company.isDemo) se borra y se recrea cada noche con npm run demo:reset."
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string, enum: [ADMIN, CASHIER] }
      responses:
        '200': { description: Sesión de la demo }
        '404': { description: La demo no está activa }
        '503': { description: La demo todavía no se creó }

  /auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 1, description: "Sin la política de contraseñas nueva (cuentas antiguas pueden tener 6 caracteres)" }
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Renovar el token de acceso
      description: El refresh token es rotativo; el anterior queda revocado.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: Tokens nuevos
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  refreshToken: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Cerrar sesión (revoca el refresh token)
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
      responses:
        '204': { description: Sesión cerrada }

  /auth/switch-company:
    post:
      tags: [Auth]
      summary: Cambiar la empresa activa
      description: Devuelve tokens nuevos para esa empresa. 403 si el usuario no está activo en ella.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [companyId]
              properties:
                companyId: { type: string, format: uuid }
      responses:
        '200':
          description: Nueva sesión
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /auth/me:
    get:
      tags: [Auth]
      summary: Datos del token actual
      responses:
        '200':
          description: Payload del JWT
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      companyId: { type: string, format: uuid }
                      role: { $ref: '#/components/schemas/Role' }
                      permissions: { type: array, items: { $ref: '#/components/schemas/Permission' }, description: Permisos efectivos (rol + ajustes) }
                      hasPin: { type: boolean }
                      pinLockedUntil: { type: string, format: date-time, nullable: true, description: Hasta cuándo no puede cambiar su código (null = puede) }
                      pinExpiresAt: { type: string, format: date-time, nullable: true }
                      pinExpired: { type: boolean, description: Vencido = no sirve hasta renovarlo }
                      pinExpiringSoon: { type: boolean, description: Vence en los próximos 5 días }
                      locationIds: { type: array, nullable: true, items: { type: string }, description: Dónde trabaja (null = todas) }
                      activeLocationId: { type: string, nullable: true, description: La ubicación activa (X-Location-Id válido) }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------------------------------------------------------- Perfil
  /profile/me:
    get:
      tags: [Perfil]
      summary: Ver mi perfil
      responses:
        '200':
          description: Perfil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Perfil]
      summary: Editar nombre y email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name: { type: string, minLength: 1 }
                email: { type: string, format: email }
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /profile/me/avatar:
    post:
      tags: [Perfil]
      summary: Subir foto de perfil
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar: { type: string, format: binary }
      responses:
        '200':
          description: Perfil con el nuevo `avatarUrl` (servido desde `/uploads/avatars/...`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /profile/me/password:
    put:
      tags: [Perfil]
      summary: Cambiar contraseña
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, minLength: 1 }
                newPassword: { type: string, minLength: 8, maxLength: 72, description: Sin las contraseñas más comunes }
      responses:
        '200': { description: Contraseña cambiada }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /profile/me/pin:
    put:
      tags: [Perfil]
      summary: Cambiar mi código de caja
      description: |
        Se confirma con la contraseña y se rechazan códigos obvios (0000, 1234, 9876...). Hace falta que el código
        lo haya generado antes el administrador (el administrador puede ponerse el suyo). Después de cambiarlo queda
        fijo 30 días (400 con la fecha). No se puede borrar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin, password]
              properties:
                pin: { type: string, pattern: '^\d{4,6}$' }
                password: { type: string, minLength: 1 }
      responses:
        '204': { description: Código guardado }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /authorizations:
    post:
      tags: [Perfil]
      summary: Autorizar una acción con el PIN de un encargado (cualquier usuario con sesión)
      description: |
        Busca entre los miembros activos de la empresa con ese permiso y PIN. Si coincide, devuelve quién
        autorizó y queda en auditoría (`AUTHORIZE`, a nombre de quien autorizó). 5 intentos fallidos por
        usuario cada 15 minutos; después 429.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin, permission]
              properties:
                pin: { type: string, pattern: '^\d{4,6}$' }
                permission: { type: string, enum: [sales.discount, sales.void] }
                reason: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Autorizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  authorizedBy: { $ref: '#/components/schemas/UserSummary' }
                  permission: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: PIN incorrecto }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ---------------------------------------------------------------- Usuarios
  /users:
    get:
      tags: [Usuarios]
      summary: Usuarios de la empresa activa (users.manage)
      description: "Sin `page`: lista completa (la usan los selectores). Con `page`: paginado. q busca por nombre o correo."
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Q'
      responses:
        '200':
          description: Lista completa o página
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { $ref: '#/components/schemas/User' }
                  - allOf:
                      - $ref: '#/components/schemas/PageMeta'
                      - type: object
                        properties:
                          items: { type: array, items: { $ref: '#/components/schemas/User' } }
  /users/{id}/toggle-active:
    patch:
      tags: [Usuarios]
      summary: Activar / desactivar un usuario en la empresa activa (users.manage)
      description: Corta su acceso a esta empresa al instante (sus otras empresas no cambian). No se puede desactivar al dueño ni a uno mismo.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Usuario con el nuevo `isActive`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /users/permissions:
    get:
      tags: [Usuarios]
      summary: Catálogo de permisos y los de cada rol (users.manage)
      responses:
        '200':
          description: Catálogo
          content:
            application/json:
              schema:
                type: object
                properties:
                  permissions: { type: array, items: { $ref: '#/components/schemas/Permission' } }
                  rolePermissions:
                    type: object
                    additionalProperties: { type: array, items: { $ref: '#/components/schemas/Permission' } }
                  authorizing: { type: array, items: { $ref: '#/components/schemas/Permission' } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /users/cash-codes:
    get:
      tags: [Usuarios]
      summary: Personas cuyo código de caja puedo asignar, con su estado (users.manage o quien autoriza)
      responses:
        '200':
          description: Lista
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    name: { type: string }
                    role: { $ref: '#/components/schemas/Role' }
                    hasPin: { type: boolean }
                    pinExpiresAt: { type: string, format: date-time, nullable: true }
                    pinExpired: { type: boolean }
                    pinExpiringSoon: { type: boolean }
                    pinLockedUntil: { type: string, format: date-time, nullable: true }
        '403': { $ref: '#/components/responses/Forbidden' }

  /users/{id}/pin:
    post:
      tags: [Usuarios]
      summary: Asignar el código de caja de una persona (users.manage; o quien autoriza, solo para cajeros)
      description: |
        Para quien abre caja o autoriza. Con `pin` asigna ese (sin códigos obvios); sin cuerpo genera uno de 6 dígitos al azar.
        Reemplaza el anterior (si lo olvidó o venció) y le permite cambiarlo enseguida. Le llega un aviso (`cashCodeAssigned`).
        El código se devuelve **una sola vez**, para entregárselo. Queda en auditoría (`AuthorizationPin`).
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                pin: { type: string, pattern: '^\d{4,6}$' }
      responses:
        '201':
          description: Código generado
          content:
            application/json:
              schema:
                type: object
                properties:
                  pin: { type: string, pattern: '^\d{6}$' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /users/{id}/access:
    patch:
      tags: [Usuarios]
      summary: Cambiar rol y permisos sueltos de una persona (users.manage)
      description: |
        Aplica en la siguiente petición de esa persona. No se puede cambiar el acceso propio, y el dueño de la
        empresa siempre es ADMIN. Si deja de poder autorizar, su PIN se borra. Queda en auditoría (`UserAccess`).
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/Role' }
                grantedPermissions: { type: array, items: { $ref: '#/components/schemas/Permission' }, default: [] }
                revokedPermissions: { type: array, items: { $ref: '#/components/schemas/Permission' }, default: [], description: No puede repetir uno de grantedPermissions }
                locationIds: { type: array, items: { type: string, format: uuid }, default: [], description: "Dónde trabaja (vacío = todas; al ADMIN no se le limita)" }
      responses:
        '200':
          description: Usuario con su nuevo acceso
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- Empresa
  /company:
    get:
      tags: [Empresa]
      summary: Empresa activa (con plan y límites)
      responses:
        '200':
          description: Empresa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Empresa]
      summary: Cambiar nombre, moneda y datos fiscales de la empresa (users.manage)
      description: |
        Al menos un campo. Cambiar la moneda solo cambia cómo se muestran los montos; no convierte valores.
        Los datos fiscales (emisor de los comprobantes) son opcionales hasta que la empresa facture; "" o null los borra.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                currency: { type: string, enum: [CRC, USD] }
                cashCodeDays: { type: integer, minimum: 7, maximum: 365 }
                posShowStock: { type: boolean, description: "El POS muestra la cantidad en stock (si no: disponible/agotado)" }
                returnDays: { type: integer, minimum: 1, maximum: 365, description: "Plazo para devolver una venta" }
                requirePaymentRef: { type: boolean, description: "Tarjeta y SINPE exigen la referencia (autorización / comprobante)" }
                sinpeNumber: { type: string, nullable: true, description: "8 dígitos; se aceptan guiones y espacios; vacío o null = borrar" }
                sinpeName: { type: string, nullable: true, maxLength: 80 }
                legalName: { type: string, nullable: true, description: Razón social o nombre de la persona física }
                idType: { $ref: '#/components/schemas/IdType' }
                idNumber: { type: string, nullable: true, description: Sin guiones }
                economicActivity: { type: string, nullable: true, description: Código de actividad económica ante Hacienda }
                invoiceEmail: { type: string, nullable: true, description: Correo que aparece en los comprobantes }
                phone: { type: string, nullable: true }
                province: { type: string, nullable: true, enum: ['1', '2', '3', '4', '5', '6', '7', null], description: "Código Hacienda: 1 San José, 2 Alajuela, 3 Cartago, 4 Heredia, 5 Guanacaste, 6 Puntarenas, 7 Limón" }
                canton: { type: string, nullable: true, pattern: '^\d{2}$' }
                district: { type: string, nullable: true, pattern: '^\d{2}$' }
                addressDetail: { type: string, nullable: true, description: Otras señas }

      responses:
        '200':
          description: Empresa actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /companies:
    get:
      tags: [Empresa]
      summary: Empresas en las que estoy activo
      responses:
        '200':
          description: Empresas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CompanyAccess' }
    post:
      tags: [Empresa]
      summary: Crear otra empresa (quedo como dueño y ADMIN)
      description: Límite = `maxCompanies` del plan. Para entrar a ella, `POST /auth/switch-company`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                currency: { type: string, enum: [CRC, USD], default: CRC }
      responses:
        '201':
          description: Empresa creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyAccess' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /invitations:
    get:
      tags: [Usuarios]
      summary: Invitaciones pendientes de la empresa activa (users.manage)
      responses:
        '200':
          description: Pendientes (sin aceptar, sin anular y sin vencer)
          content:
            application/json:
              schema:
                type: array
                items: { type: object, additionalProperties: true }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Usuarios]
      summary: Invitar a alguien a la empresa (users.manage)
      description: |
        Devuelve el `link` (con el token) **solo esta vez**; vence en 7 días. Invitar de nuevo al mismo email
        anula la anterior. Usuarios activos + invitaciones pendientes no pueden pasar `maxUsersPerCompany` del plan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                role: { type: string, enum: [ADMIN, MANAGER, EMPLOYE, CASHIER, ACCOUNTANT], default: EMPLOYE }
      responses:
        '201':
          description: Invitación creada
          content:
            application/json:
              schema:
                type: object
                properties:
                  link: { type: string, example: "http://localhost:5173/invite/<token>" }
                  invitation: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /invitations/{id}:
    delete:
      tags: [Usuarios]
      summary: Anular una invitación pendiente (users.manage)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Anulada }
        '404': { $ref: '#/components/responses/NotFound' }

  /invitations/token/{token}:
    get:
      tags: [Usuarios]
      summary: Ver una invitación por su link (público)
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Datos para mostrar en la página del link
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [valid, expired, revoked, accepted] }
                  email: { type: string }
                  role: { type: string, enum: [ADMIN, MANAGER, EMPLOYE, CASHIER, ACCOUNTANT] }
                  company: { type: string }
                  invitedBy: { type: string }
                  expiresAt: { type: string, format: date-time }
                  userExists: { type: boolean, description: "true = entra con su contraseña; false = crea cuenta" }
        '404': { $ref: '#/components/responses/NotFound' }

  /invitations/token/{token}/accept:
    post:
      tags: [Usuarios]
      summary: Aceptar una invitación (público)
      description: Cuenta nueva = `name` + `password`; cuenta existente = su `password`. Devuelve la sesión ya abierta en esa empresa.
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                name: { type: string }
                password: { type: string, minLength: 6 }
                acceptTerms: { type: boolean, description: Obligatoria (true) solo si la invitación crea una cuenta nueva }
      responses:
        '200':
          description: Sesión
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ---------------------------------------------------------------- Plataforma
  /platform/companies:
    get:
      tags: [Plataforma]
      summary: Todas las empresas de la plataforma (solo dueño de la plataforma)
      description: |
        Nombre, dueño, plan, uso y estado. **Nunca** devuelve datos de inventario de los clientes.
        El dueño de la plataforma se marca solo con `npm run owner -- correo` (no hay endpoint).
      responses:
        '200':
          description: Empresas, de la más reciente a la más antigua
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    name: { type: string }
                    currency: { type: string, enum: [CRC, USD] }
                    createdAt: { type: string, format: date-time }
                    suspendedAt: { type: string, format: date-time, nullable: true }
                    suspensionReason: { type: string, nullable: true }
                    owner:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        email: { type: string }
                    plan: { type: string, enum: [BASIC, PRO, BUSINESS] }
                    limits: { type: object, additionalProperties: true }
                    users: { type: integer, description: Miembros activos }
                    products: { type: integer, description: Productos no eliminados }
        '403': { $ref: '#/components/responses/Forbidden' }

  /platform/companies/{id}/plan:
    patch:
      tags: [Plataforma]
      summary: Cambiar el plan del dueño de la empresa (solo dueño de la plataforma)
      description: El plan es de la cuenta del dueño, así que aplica a todas sus empresas. Queda en la auditoría.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan]
              properties:
                plan: { type: string, enum: [BASIC, PRO, BUSINESS] }
      responses:
        '204': { description: Plan cambiado }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /platform/companies/{id}/suspension:
    patch:
      tags: [Plataforma]
      summary: Suspender o reactivar una empresa (solo dueño de la plataforma)
      description: |
        Con la empresa suspendida, sus usuarios pueden iniciar sesión pero toda ruta de datos responde
        **403 `COMPANY_SUSPENDED`** con el motivo. No se borra nada. Queda en la auditoría.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [suspended]
              properties:
                suspended: { type: boolean }
                reason: { type: string, maxLength: 300, description: Lo ve la empresa }
      responses:
        '204': { description: Estado cambiado }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- Categorías
  /categories:
    get:
      tags: [Categorías]
      summary: Listar categorías
      responses:
        '200':
          description: Categorías (sin las eliminadas)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Categorías]
      summary: Crear categoría (products.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '201':
          description: Creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /categories/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Categorías]
      summary: Ver una categoría
      responses:
        '200':
          description: Categoría
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Categorías]
      summary: Editar categoría (products.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '200':
          description: Actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Categorías]
      summary: Eliminar categoría (products.manage, soft delete)
      responses:
        '200': { description: Eliminada }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- Productos
  /products:
    get:
      tags: [Productos]
      summary: Listar productos (paginado, búsqueda y filtros en el servidor)
      description: |
        `view=flat` (por defecto): productos; lo usa el selector con búsqueda y el despliegue de un producto base (`groupId`).
        `view=grouped`: la tabla de Productos — primero los productos base (`kind: group`, con el resumen de sus
        variantes: variantCount, minPrice, maxPrice, totalStock, unit, lowCount) y después los productos sueltos
        (`kind: product`), paginados como una sola lista; trae además `pendingCount`.
        `q` busca en nombre, SKU, código de barras (exacto), categoría y producto base.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Q'
        - name: view
          in: query
          schema: { type: string, enum: [flat, grouped], default: flat }
        - name: categoryId
          in: query
          schema: { type: string, format: uuid }
        - name: supplierId
          in: query
          schema: { type: string, format: uuid }
        - name: groupId
          in: query
          description: "Variantes de un producto base"
          schema: { type: string, format: uuid }
        - name: pending
          in: query
          description: "Importados Por completar"
          schema: { type: string, enum: ['1', '0', 'true', 'false'] }
        - name: lowStock
          in: query
          description: "stock <= stock mínimo"
          schema: { type: string, enum: ['1', 'true'] }
      responses:
        '200':
          description: Página de productos
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/Product' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Productos]
      summary: Crear producto (products.manage)
      description: Falla con 400 si se alcanzó `maxProducts` del plan.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductCreateInput' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /products/import/ai-map:
    post:
      tags: [Productos]
      summary: Ayuda de la IA para reconocer columnas al importar (products.manage)
      description: |
        Se manda solo una muestra (máx. 25 filas, celdas recortadas a 80 caracteres), nunca el archivo. La IA devuelve la fila
        de encabezados (headerRow, desde 0) y qué columna es cada dato (mapping: campo → índice); se valida todo. La respuesta
        se guarda por formato: el mismo formato otra vez no consulta ni cuenta (cached: true). Tope por plan y mes:
        Básico 5, Pro 30, Empresa 100 (429 al llegar). 503 si la IA de la plataforma está en pausa por presupuesto.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rows]
              properties:
                rows: { type: array, maxItems: 25, items: { type: array, items: {} } }
      responses:
        "200": { description: "{ headerRow, mapping, cached, used, limit, remaining }" }
        "429": { description: Se usaron las importaciones con IA del mes }
        "503": { description: IA en pausa (presupuesto de la plataforma) }

  /products/import/ai-quota:
    get:
      tags: [Productos]
      summary: Importaciones con IA usadas y disponibles este mes (products.manage)
      responses:
        "200": { description: "{ used, limit, remaining }" }

  /products/barcodes:
    post:
      tags: [Productos]
      summary: Generar códigos de barras internos (products.manage)
      description: |
        Para los productos sin código (los indicados, o todos): EAN-13 interno con prefijo 20 (GS1 lo reserva para uso
        dentro de la tienda) y la siguiente secuencia libre de la empresa. No reutiliza códigos de productos eliminados.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                productIds: { type: array, items: { type: string, format: uuid }, maxItems: 2000 }
      responses:
        "200":
          description: Códigos asignados
          content:
            application/json:
              schema:
                type: object
                properties:
                  generated: { type: integer }
                  products: { type: array, items: { type: object, properties: { id: { type: string }, barcode: { type: string } } } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /products/import:
    post:
      tags: [Productos]
      summary: Importar productos desde Excel (products.manage)
      description: |
        El frontend lee el .xlsx y manda las filas. Con `dryRun: true` solo valida y devuelve la vista previa.
        Reglas: una categoría o proveedor que no existe se crea; solo se importan las filas válidas; respeta el
        límite de productos del plan (las actualizaciones no cuentan). Sin `options` es estricto: cualquier dato
        faltante o inválido es error y un SKU existente se salta. `options` activa arreglos en bloque; un SKU
        existente con `updateExisting` actualiza solo los campos que trae (nunca el stock) y deja auditoría.
        Hasta 2000 filas (esta ruta acepta cuerpos de hasta 2 MB).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rows, dryRun]
              properties:
                dryRun: { type: boolean }
                options:
                  type: object
                  properties:
                    defaultCategory: { type: string, maxLength: 100, description: Categoría para filas sin categoría }
                    generateSku: { type: boolean, description: SKU automático IMP-0001… para filas sin SKU }
                    pendingPrice: { type: boolean, description: Sin precio válido → precio 0 y marca pendingReview }
                    fixNumbers: { type: boolean, description: "Redondea stock, negativos a 0, quita costo inválido" }
                    ignoreInvalidDate: { type: boolean }
                    dropConflictingBarcode: { type: boolean }
                    skipRepeated: { type: boolean, description: SKU repetido en el archivo → se usa la primera fila }
                    updateExisting: { type: boolean }
                    ignoreBadFiscal: { type: boolean, description: "Unidad/IVA/CABYS no reconocidos → unidad actual o UNIT, IVA actual o 13 %, sin CABYS" }
                rows:
                  type: array
                  minItems: 1
                  maxItems: 2000
                  items:
                    type: object
                    required: [rowNumber]
                    properties:
                      rowNumber: { type: integer, description: Fila del Excel (para reportar errores) }
                      sku: { type: string }
                      name: { type: string }
                      category: { type: string }
                      price: { type: number }
                      cost: { type: number }
                      stock: { type: number, description: "Entero si la unidad es UNIT; máx. 3 decimales" }
                      minStock: { type: number }
                      barcode: { type: string }
                      description: { type: string }
                      supplier: { type: string }
                      expirationDate: { type: string, example: "2027-03-31" }
                      unit: { type: string, example: "kg", description: "Texto libre: unidad, kg, kilos, g, L, litros, mL, m, cm, m²…" }
                      taxRate: { type: string, example: "13 %", description: "13, 4, 2, 1, Exento (también 0.13 o 13 %)" }
                      cabys: { type: string, example: "2391000000000" }
      responses:
        '200':
          description: Vista previa (dryRun)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportResult' }
        '201':
          description: Importación hecha
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /products/expiring-soon:
    get:
      tags: [Productos]
      summary: Productos que vencen pronto
      parameters:
        - name: days
          in: query
          schema: { type: integer, default: 7 }
      responses:
        '200':
          description: Productos con `expirationDate` dentro del plazo
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Product' }

  /products/barcode/{code}:
    get:
      tags: [Productos]
      summary: Buscar producto por código de barras
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Producto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404': { $ref: '#/components/responses/NotFound' }

  /products/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Productos]
      summary: Ver un producto
      responses:
        '200':
          description: Producto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/BadRequest' }
    put:
      tags: [Productos]
      summary: Editar producto (products.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductUpdateInput' }
      responses:
        '200':
          description: Actualizado (un cambio de precio queda en el historial)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Productos]
      summary: Eliminar producto (products.manage, soft delete)
      responses:
        '200': { description: Eliminado }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /products/{id}/price-history:
    get:
      tags: [Productos]
      summary: Historial de precios del producto
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Cambios de precio, del más reciente al más antiguo
          content:
            application/json:
              schema:
                type: array
                items: { type: object, additionalProperties: true }

  # ---------------------------------------------------------------- Movimientos
  /movements:
    get:
      tags: [Movimientos]
      summary: Listar movimientos de stock (paginado, más recientes primero)
      description: "`q` busca en el nombre/SKU del producto y en el motivo."
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Q'
        - name: productId
          in: query
          schema: { type: string, format: uuid }
        - name: type
          in: query
          schema: { type: string, enum: [IN, OUT, ADJUSTMENT] }
        - name: source
          in: query
          schema: { $ref: '#/components/schemas/MovementSource' }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Página de movimientos
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/Movement' } }
    post:
      tags: [Movimientos]
      summary: Registrar entrada, salida o ajuste (stock.move)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MovementInput' }
      responses:
        '201':
          description: Movimiento creado; el stock del producto se actualiza
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Movement' }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ---------------------------------------------------------------- Proveedores
  /locations:
    get:
      tags: [Ubicaciones]
      summary: Sucursales y bodegas que ve la persona (las suyas; el admin, todas)
      parameters:
        - { name: inactive, in: query, schema: { type: string, enum: ["1"] }, description: "Incluye las desactivadas (company.manage)" }
      responses:
        '200':
          description: Lista
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Location' } }
    post:
      tags: [Ubicaciones]
      summary: Crear sucursal o bodega (company.manage)
      description: Las sucursales cuentan para el límite del plan y reciben el siguiente código (001, 002…). Las bodegas no tienen límite ni código.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocationInput' }
      responses:
        '201':
          description: Creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Location' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /locations/{id}:
    patch:
      tags: [Ubicaciones]
      summary: Editar, activar o desactivar una ubicación (company.manage)
      description: |
        No se borran: se desactivan, y solo si ya no tienen stock, transferencias en tránsito ni órdenes por recibir.
        La empresa siempre conserva al menos una activa.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                type: { type: string, enum: [BRANCH, WAREHOUSE] }
                address: { type: string, nullable: true }
                sinpeNumber: { type: string, nullable: true, description: "SINPE Móvil de la sucursal (8 dígitos); vacío = el general de la empresa" }
                sinpeName: { type: string, nullable: true }
                isActive: { type: boolean }
      responses:
        '200':
          description: Actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Location' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /transfers:
    get:
      tags: [Ubicaciones]
      summary: Transferencias de mis ubicaciones (stock.move, paginado)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { name: status, in: query, schema: { type: string, enum: [IN_TRANSIT, RECEIVED, CANCELLED] } }
      responses:
        '200':
          description: Página
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/StockTransfer' } }
    post:
      tags: [Ubicaciones]
      summary: Enviar una transferencia (stock.move, trabajando en el origen)
      description: |
        El stock sale del origen (movimiento OUT, origen TRANSFER) y queda en tránsito: sigue contando en el total del
        producto. Avisa a quienes reciben en el destino. Falla si no alcanza el stock en el origen.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toLocationId, items]
              properties:
                fromLocationId: { type: string, format: uuid, description: "Sin indicar: la ubicación activa" }
                toLocationId: { type: string, format: uuid }
                notes: { type: string, maxLength: 500 }
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [productId, quantity]
                    properties:
                      productId: { type: string, format: uuid }
                      quantity: { type: number }
      responses:
        '201':
          description: Enviada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockTransfer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /transfers/{id}:
    get:
      tags: [Ubicaciones]
      summary: Ver una transferencia (stock.move)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Transferencia
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockTransfer' }
        '404': { $ref: '#/components/responses/NotFound' }

  /transfers/{id}/receive:
    post:
      tags: [Ubicaciones]
      summary: Recibir una transferencia (stock.move, trabajando en el destino)
      description: |
        Entra al destino lo que llegó (movimiento IN). Lo que falte (enviado − recibido) es faltante: sale del total del
        producto y queda en auditoría; a quien la envió le llega un aviso. Sin cuerpo = llegó todo.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [itemId, receivedQuantity]
                    properties:
                      itemId: { type: string, format: uuid }
                      receivedQuantity: { type: number, minimum: 0, description: No más de lo enviado }
      responses:
        '200':
          description: Recibida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockTransfer' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /transfers/{id}/cancel:
    post:
      tags: [Ubicaciones]
      summary: Cancelar una transferencia en tránsito (quien la envió, o purchases.manage)
      description: Devuelve todo al origen (movimiento IN, origen TRANSFER).
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Cancelada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockTransfer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /pos/registers:
    get:
      tags: [Punto de venta]
      summary: Cajas de mis sucursales con su turno abierto (cash.manage)
      responses:
        '200':
          description: Cajas
          content:
            application/json:
              schema: { type: array, items: { type: object } }
    post:
      tags: [Punto de venta]
      summary: Crear una caja en una sucursal (company.manage)
      description: "Terminal de 5 dígitos correlativo por sucursal. Límite del plan: maxRegistersPerBranch."
      requestBody:
        required: true
        content:
          application/json:
            schema: 
              type: object
              required: [locationId, name]
              properties:
                locationId: { type: string, format: uuid }
                name: { type: string, maxLength: 60 }
                ticketWidth: { type: integer, enum: [80, 58], default: 80 }
                customerDisplay: { type: boolean, default: false, description: "Segunda pantalla mirando al cliente" }
      responses:
        '201': { description: Caja creada }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /pos/registers/{id}:
    patch:
      tags: [Punto de venta]
      summary: Editar o desactivar una caja (company.manage; no con un turno abierto)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: 
              type: object
              properties:
                name: { type: string, maxLength: 60 }
                ticketWidth: { type: integer, enum: [80, 58] }
                customerDisplay: { type: boolean }
                isActive: { type: boolean }
      responses:
        '200': { description: Caja }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /pos/session:
    get:
      tags: [Punto de venta]
      summary: Mi turno abierto con su resumen (o null)
      responses:
        '200': { description: "Turno con summary { openingAmount, salesCount, salesTotal, payments, cashIn, cashOut, expectedCash }" }
    post:
      tags: [Punto de venta]
      summary: Abrir caja con mi código de caja vigente y el monto inicial
      description: "423 PIN_EXPIRED si el código venció (caja bloqueada hasta renovarlo). 409 si la caja ya está abierta o ya tengo otra abierta."
      requestBody:
        required: true
        content:
          application/json:
            schema: 
              type: object
              required: [registerId, pin, openingAmount]
              properties:
                registerId: { type: string, format: uuid }
                pin: { type: string, pattern: '^\d{4,6}$' }
                openingAmount: { type: number, minimum: 0 }
      responses:
        '201': { description: Turno abierto }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Caja ya abierta }
        '423': { description: Código vencido (code PIN_EXPIRED) }

  /pos/session/renew-code:
    post:
      tags: [Punto de venta]
      summary: Renovar mi código vencido con el código de un encargado o del admin
      description: Devuelve el código nuevo una sola vez.
      requestBody:
        required: true
        content:
          application/json:
            schema: 
              type: object
              required: [managerPin]
              properties:
                managerPin: { type: string, pattern: '^\d{4,6}$' }
      responses:
        '200': { description: "{ pin }" }
        '403': { $ref: '#/components/responses/Forbidden' }

  /pos/session/movements:
    get:
      tags: [Punto de venta]
      summary: Entradas y retiros de efectivo de mi turno
      responses:
        '200': { description: Movimientos }
    post:
      tags: [Punto de venta]
      summary: Registrar una entrada o un retiro de efectivo
      requestBody:
        required: true
        content:
          application/json:
            schema: 
              type: object
              required: [type, amount, reason]
              properties:
                type: { type: string, enum: [IN, OUT] }
                amount: { type: number, minimum: 0.01 }
                reason: { type: string, maxLength: 200 }
      responses:
        '201': { description: Movimiento }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /pos/sessions/{id}/close:
    post:
      tags: [Punto de venta]
      summary: "Paso 1: cierre ciego del cajero (quien lo abrió, users.manage o cash.reconcile)"
      description: "Ya no se vende en ese turno y queda pendiente de arqueo. Devuelve el reporte del turno (sin el efectivo esperado para quien no hace arqueos)."
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 500 }
      responses:
        '200': { description: Reporte del turno }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /pos/sessions:
    get:
      tags: [Punto de venta]
      summary: Cierres de caja de mis sucursales (cash.reconcile, paginado)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { name: pending, in: query, schema: { type: string, enum: ['1', '0'] }, description: "1 = sin arqueo; 0 = con arqueo" }
      responses:
        '200': { description: "Página con pendingCount" }

  /pos/sessions/{id}/report:
    get:
      tags: [Punto de venta]
      summary: Reporte de un turno (el cajero, el suyo sin esperado ni diferencia; cash.reconcile, todos)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: "Turno con summary, movimientos, conteo y (cash.reconcile) expectedCash, difference, cardDifference" }
        '404': { $ref: '#/components/responses/NotFound' }

  /pos/sessions/{id}/reconcile:
    post:
      tags: [Punto de venta]
      summary: "Paso 2: arqueo de la jefa de caja con el cajero (cash.reconcile; no el de su propia caja)"
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [denominations]
              properties:
                denominations: { type: object, additionalProperties: { type: integer, minimum: 0 }, description: "valor → cantidad" }
                cardDeclared: { type: number, minimum: 0, description: "Total del cierre en papel del datáfono (opcional)" }
                sinpeDeclared: { type: number, minimum: 0, description: "Total de SINPE que entró según el banco (opcional); se compara con ventas + abonos − devoluciones por SINPE" }
                note: { type: string, maxLength: 500 }
      responses:
        '200': { description: Reporte con el arqueo }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: Ya tiene arqueo }

  /pos/sales:
    post:
      tags: [Punto de venta]
      summary: Vender (sales.sell, con caja abierta)
      description: "Emite el tiquete y saca el stock de la sucursal de la caja en la misma transacción. Sin stock suficiente: 409 NEGATIVE_NEEDS_AUTH con shortages (se reintenta con negativePin = código de un encargado con sales.negative; el stock queda en negativo y se registra la negativa para inventario); productos con lotes 409 NO_STOCK; 409 NO_SESSION sin caja abierta. Descuentos (por línea o sobre el total, de un tipo de descuento): siempre con discountPin de un encargado con sales.discount, si no 409 DISCOUNT_NEEDS_AUTH; el del total se reparte entre las líneas. Ajuste de precio por línea (price menor al del catálogo + priceReason, mismo discountPin): va como descuento «Ajuste de precio: motivo». Crédito: credit = { frequency BIWEEKLY|MONTHLY, installments } (hasta 6 meses) con creditPin de un encargado con sales.credit (sin él 409 CREDIT_NEEDS_AUTH, código que no sirve 403 CREDIT_PIN); los payments son la prima y el resto va a cuotas; 409 CREDIT_CUSTOMER (cliente sin crédito), CREDIT_OVERDUE (cuotas vencidas) o CREDIT_LIMIT (pasa el límite). Con un cliente identificado emite factura (INVOICE) en vez de tiquete. Devuelve los datos del comprobante y negatives (cantidad de negativas). Tarjeta y SINPE: con requirePaymentRef de la empresa (por defecto) la referencia es obligatoria (400 PAYMENT_REF_REQUIRED); un comprobante SINPE ya usado en otra venta se rechaza (409 SINPE_REF_USED, la referencia se guarda sin espacios). Idempotencia (8B): con clientSaleId (uuid que genera la caja), si esa venta ya existe se devuelve la misma con duplicate: true en vez de duplicarla. Venta hecha sin conexión: soldAt (hora real, dentro del turno) + seenPrice por línea (precio cobrado); solo contado simple (sin descuentos, ajustes de precio ni crédito); las negativas se aceptan sin código (StockNegative.offline) y si el precio cambió queda en la auditoría."
      requestBody:
        required: true
        content:
          application/json:
            schema: 
              type: object
              required: [lines]
              properties:
                customerId: { type: string, format: uuid }
                credit:
                  type: object
                  required: [frequency, installments]
                  properties:
                    frequency: { type: string, enum: [BIWEEKLY, MONTHLY] }
                    installments: { type: integer, minimum: 1, maximum: 12, description: "Mensual hasta 6, quincenal hasta 12" }
                creditPin: { type: string, pattern: '^\d{4,6}$', description: "Código del encargado que autoriza el crédito" }
                clientSaleId: { type: string, format: uuid, description: "Lo genera la caja: la misma venta reenviada no se duplica" }
                soldAt: { type: string, format: date-time, description: "Venta hecha sin conexión: la hora real en que se vendió" }
                notes: { type: string, maxLength: 500 }
                negativePin: { type: string, pattern: '^\d{4,6}$', description: "Código del encargado que autoriza las negativas" }
                discountPin: { type: string, pattern: '^\d{4,6}$', description: "Código del encargado que autoriza los descuentos y ajustes de precio" }
                discount: { $ref: '#/components/schemas/DiscountPick' }
                lines:
                  type: array
                  items:
                    type: object
                    required: [productId, quantity]
                    properties:
                      productId: { type: string, format: uuid }
                      quantity: { type: number }
                      discount: { $ref: '#/components/schemas/DiscountPick' }
                      price: { type: number, description: "Precio unitario con IVA menor al del catálogo (precio de góndola)" }
                      priceReason: { type: string, minLength: 3, maxLength: 60, description: "Obligatorio con price" }
                      seenPrice: { type: number, description: "Sin conexión: el precio con IVA que vio y cobró el cajero" }
                payments:
                  type: array
                  items:
                    type: object
                    required: [method, amount]
                    properties:
                      method: { type: string, enum: [CASH, CARD, SINPE] }
                      amount: { type: number }
                      reference: { type: string, description: "Autorización del datáfono o comprobante SINPE" }
                      tendered: { type: number, description: "Efectivo recibido (vuelto = tendered - amount)" }
      responses:
        '201': { description: "{ document, company, register, location, cashier }" }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Sin stock o sin caja abierta }

  /pos/discount-types:
    get:
      tags: [Punto de venta]
      summary: Tipos de descuento (activos e inactivos)
      responses:
        '200': { description: Lista de tipos de descuento }
    post:
      tags: [Punto de venta]
      summary: Crear tipo de descuento (company.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiscountTypeInput' }
      responses:
        '201': { description: Tipo creado }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /pos/discount-types/{id}:
    put:
      tags: [Punto de venta]
      summary: Editar o desactivar un tipo de descuento (company.manage)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiscountTypeInput' }
      responses:
        '200': { description: Tipo actualizado }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /receivables:
    get:
      tags: [Cuentas por cobrar]
      summary: Clientes con crédito o saldo, con lo vencido (receivables.manage, paginado)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Q'
        - { name: overdue, in: query, schema: { type: string, enum: ['1', '0'] }, description: "1 = solo con cuotas vencidas" }
      responses:
        '200': { description: "{ items, total, page, pageSize, totals: { balance, overdue } }" }
        '403': { $ref: '#/components/responses/Forbidden' }

  /receivables/payments:
    post:
      tags: [Cuentas por cobrar]
      summary: Registrar un abono
      description: "inRegister true = en la caja abierta de quien cobra (sales.sell; efectivo, tarjeta o SINPE; el efectivo entra al arqueo). false = sin caja (receivables.manage; reference obligatoria). Se aplica a la cuota más vieja primero; no puede superar el saldo. Devuelve el recibo."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, amount, method, inRegister]
              properties:
                customerId: { type: string, format: uuid }
                amount: { type: number }
                method: { type: string, enum: [CASH, CARD, SINPE, TRANSFER] }
                reference: { type: string, maxLength: 60 }
                tendered: { type: number, description: "Efectivo recibido" }
                note: { type: string, maxLength: 200 }
                bankAccountId: { type: string, format: uuid, description: "Sin caja y no en efectivo: la cuenta donde entró" }
                inRegister: { type: boolean }
      responses:
        '201': { description: "Recibo: { payment (balanceBefore, amount, balanceAfter), company }" }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: NO_SESSION }

  /receivables/payments/{id}:
    get:
      tags: [Cuentas por cobrar]
      summary: Recibo de un abono (sales.sell o receivables.manage)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Recibo }
        '404': { $ref: '#/components/responses/NotFound' }

  /receivables/{id}:
    get:
      tags: [Cuentas por cobrar]
      summary: Estado de cuenta del cliente (sales.sell o receivables.manage)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: "{ customer, creditLimit, balance, available, overdue, overdueCount, installments, payments }" }
        '404': { $ref: '#/components/responses/NotFound' }

  /receivables/{id}/credit:
    put:
      tags: [Cuentas por cobrar]
      summary: Habilitar o quitar el crédito de un cliente (credit.manage)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [creditLimit]
              properties:
                creditLimit: { type: number, nullable: true, description: "null = sin crédito; necesita identificación" }
      responses:
        '200': { description: Cliente actualizado }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /sales:
    get:
      tags: [Ventas]
      summary: Tiquetes, facturas y notas de crédito (sales.sell, sales.void o reports.view; paginado)
      description: "q busca por el final del consecutivo o por el nombre del cliente. Se limita a las ubicaciones de la persona."
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Q'
        - { name: kind, in: query, schema: { type: string, enum: [SALE, CREDIT_NOTE] } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: registerId, in: query, schema: { type: string, format: uuid } }
        - { name: customerId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Página de comprobantes }
        '403': { $ref: '#/components/responses/Forbidden' }

  /sales/{id}:
    get:
      tags: [Ventas]
      summary: Comprobante con su tiquete, lo devuelto por línea (returned), sus notas de crédito y returnUntil
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: "{ document, company, register, location, cashier, returned, creditNotes, returnUntil }" }
        '404': { $ref: '#/components/responses/NotFound' }

  /sales/{id}/returns:
    post:
      tags: [Ventas]
      summary: Devolver productos de una venta (nota de crédito)
      description: "Siempre con pin de un encargado con sales.void (403 RETURN_PIN). No más de lo vendido menos lo ya devuelto; dentro de Company.returnDays (409 RETURN_EXPIRED). GOOD vuelve al stock (RETURN); DAMAGED no vuelve y avisa a inventario (returnDamaged). Venta a crédito: primero rebaja sus cuotas desde la última; el resto se reembolsa con refund (CASH necesita la caja abierta de quien devuelve, 409 NO_SESSION). Devuelve el tiquete de la nota, credited y refund."
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines, reason, pin]
              properties:
                lines:
                  type: array
                  items:
                    type: object
                    required: [lineId, quantity, condition]
                    properties:
                      lineId: { type: string, format: uuid }
                      quantity: { type: number }
                      condition: { type: string, enum: [GOOD, DAMAGED] }
                reason: { type: string, minLength: 3, maxLength: 200 }
                refund:
                  type: object
                  required: [method]
                  properties:
                    method: { type: string, enum: [CASH, CARD, SINPE, TRANSFER] }
                    reference: { type: string, maxLength: 60 }
                pin: { type: string, pattern: '^\d{4,6}$' }
      responses:
        '201': { description: Tiquete de la nota de crédito }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: RETURN_PIN }
        '409': { description: RETURN_EXPIRED o NO_SESSION }

  /negatives:
    get:
      tags: [Punto de venta]
      summary: Negativas de mis ubicaciones (stock.move, paginado)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { name: status, in: query, schema: { type: string, enum: [OPEN, RESOLVED] } }
      responses:
        '200': { description: "Página con openCount (pendientes)" }

  /negatives/{id}/resolve:
    post:
      tags: [Punto de venta]
      summary: Resolver una negativa (stock.move)
      description: "Con countedQuantity ajusta el stock de la sucursal a lo contado."
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution]
              properties:
                resolution: { type: string, maxLength: 500 }
                countedQuantity: { type: number, minimum: 0 }
      responses:
        '200': { description: Negativa resuelta }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /pos/catalog:
    get:
      tags: [Punto de venta]
      summary: Catálogo de la caja para vender sin conexión (sales.sell, con caja abierta)
      description: "Todos los productos activos con el stock de la sucursal de la caja, y las categorías. La caja lo guarda en el navegador (IndexedDB) y lo vuelve a pedir cada 5 minutos."
      responses:
        '200': { description: "{ sessionId, products: [{ id, name, sku, barcode, price, minStock, taxRate, unit, tracksLots, categoryId, stock }], categories: [{ id, name }], at }" }
        '409': { description: NO_SESSION }

  /pos/offline-failures:
    post:
      tags: [Punto de venta]
      summary: Reportar una venta sin conexión que el servidor rechazó al sincronizar (sales.sell)
      description: "La caja la reporta una vez: queda en la auditoría (OfflineSaleFailed) y se avisa a quien hace arqueos (cash.reconcile) de esa sucursal, porque esa plata va a salir como sobrante. En la caja el cajero la reintenta o la descarta."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientSaleId, error, total, soldAt]
              properties:
                clientSaleId: { type: string, format: uuid }
                error: { type: string, maxLength: 300, description: "Lo que respondió el servidor" }
                total: { type: number }
                soldAt: { type: string, format: date-time }
      responses:
        '201': { description: "{ ok: true }" }

  /pos/tickets/{id}:
    get:
      tags: [Punto de venta]
      summary: Datos para reimprimir el tiquete de un comprobante (sales.sell)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: "{ document, company, register, location, cashier }" }
        '404': { $ref: '#/components/responses/NotFound' }

  /stock-counts:
    get:
      tags: [Ubicaciones]
      summary: Conteos físicos de mis ubicaciones (stock.move, paginado)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { name: status, in: query, schema: { type: string, enum: [OPEN, CLOSED, CANCELLED] } }
      responses:
        '200': { description: Página de conteos (cada uno con _count.items) }
    post:
      tags: [Ubicaciones]
      summary: Abrir un conteo (stock.move, trabajando en esa ubicación)
      description: Con todos los productos o los de una categoría. Uno abierto por ubicación a la vez.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                locationId: { type: string, format: uuid, description: "Sin indicar: la ubicación activa" }
                categoryId: { type: string, format: uuid, description: "Sin indicar: todos los productos" }
                notes: { type: string, maxLength: 500 }
      responses:
        '201':
          description: Conteo abierto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockCount' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /stock-counts/{id}:
    get:
      tags: [Ubicaciones]
      summary: Ver un conteo con sus líneas (stock.move)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Conteo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockCount' }
        '404': { $ref: '#/components/responses/NotFound' }

  /stock-counts/{id}/items:
    put:
      tags: [Ubicaciones]
      summary: Guardar lo contado (se puede ir guardando de a poco)
      description: |
        Al contar una línea se guarda lo que dice el sistema en ese momento (`systemQuantity`). Un producto que no estaba
        en la lista se agrega. `countedQuantity: null` borra lo contado.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [productId, countedQuantity]
                    properties:
                      productId: { type: string, format: uuid }
                      countedQuantity: { type: number, nullable: true, minimum: 0 }
      responses:
        '200':
          description: Conteo actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockCount' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /stock-counts/{id}/close:
    post:
      tags: [Ubicaciones]
      summary: Cerrar el conteo y ajustar el stock
      description: |
        Por cada línea contada se aplica la diferencia (contado − lo que decía el sistema al contarla) con un movimiento
        IN u OUT de origen COUNT en la ubicación del conteo. Lo no contado no se toca. Queda en auditoría.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Cerrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockCount' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /stock-counts/{id}/cancel:
    post:
      tags: [Ubicaciones]
      summary: Cancelar el conteo (el stock no cambia)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Cancelado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockCount' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /reports/daily-summary:
    get:
      tags: [Reportes]
      summary: Resumen del día guardado (reports.view; no genera ni gasta)
      parameters:
        - { name: date, in: query, required: true, schema: { type: string, example: "2026-10-16" } }
        - { name: since, in: query, required: true, schema: { type: string, format: date-time }, description: Inicio del día en la zona del navegador }
      responses:
        "200": { description: "{ date, data, text, generatedAt } o null si todavía no se generó" }
    post:
      tags: [Reportes]
      summary: Generar el resumen del día con IA (reports.view; uno por día por empresa)
      description: |
        Los números (movimientos, stock bajo, por vencer, solicitudes, órdenes, transferencias, conteos) los calcula el
        servidor, sin costos; la IA solo los redacta. Cada resumen se guarda (historial); si ya hay uno ese día se
        devuelve, salvo con force=1 (genera otro; el anterior queda). Si la IA está en pausa o falla, devuelve los números
        con text null (y no guarda).
      parameters:
        - { name: date, in: query, required: true, schema: { type: string } }
        - { name: since, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: force, in: query, schema: { type: string, enum: ["1"] }, description: Volver a generar }
      responses:
        "200": { description: "{ id, date, data, text, generatedAt }" }

  /reports/sales:
    get:
      tags: [Reportes]
      summary: Reporte de ventas del período (reports.view; la ganancia solo con costs.view)
      description: "Ventas = tiquetes y facturas; devoluciones = notas de crédito; montos con IVA. Devuelve totals y previous (período anterior del mismo largo) {gross, returns, net, tickets, average}, byDay, byMethod (CREDIT = lo que se fue a cuotas), byCashier, byRegister, discounts {total, byAuthorizer}, profit (null sin costs.view; con el costo guardado en cada línea al vender — DocumentLine.unitCost —, las ventas viejas sin él usan el costo actual; lo devuelto dañado sigue como costo), products (neto, hasta 100) y notSold (con stock en las ubicaciones de la persona y sin ventas, hasta 50). Días en la zona de Costa Rica. Máximo un año."
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: Reporte }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /reports/sales-today:
    get:
      tags: [Reportes]
      summary: Ventas de hoy y de ayer para el Panel (reports.view)
      responses:
        '200': { description: "{ today, yesterday } con { gross, returns, net, tickets, average }" }

  /reports/my-sales:
    get:
      tags: [Reportes]
      summary: Las ventas del cajero en un mes (sales.sell)
      description: "Sus tiquetes y facturas del mes y lo devuelto de ellas (para comisiones)."
      parameters:
        - { name: month, in: query, schema: { type: string, pattern: '^\d{4}-\d{2}$' }, description: "AAAA-MM (por defecto el actual)" }
      responses:
        '200': { description: "{ month, gross, returns, net, tickets, returnsCount, byDay }" }
        '403': { $ref: '#/components/responses/Forbidden' }

  /reports/vat:
    get:
      tags: [Reportes]
      summary: IVA del mes, Formulario 150 (accounting.view)
      description: |
        Guía para el contador, de toda la empresa. I. Ventas por tarifa (tiquetes, facturas y notas de débito menos las
        notas de crédito; base sin IVA). II. Compras por tarifa de las facturas de proveedor del mes (por fecha de la
        factura, sin anuladas), separadas en acreditables y no acreditables. III. Liquidación: débito fiscal − crédito fiscal
        (IVA acreditable × prorrata) − retenciones de IVA por tarjeta. La prorrata de un mes sin anotar se hereda del
        último mes que la tenga. Respuesta { month, sales: { rows, totals }, purchases: { creditable, nonCreditable, invoices },
        prorata: { value, source: month|inherited|none, inheritedFrom?, applies, suggestedMonth, suggestedLastYear },
        liquidation: { debit, creditableTax, credit, cardWithholding, balance, toPay, inFavor }, period }.
      parameters:
        - { name: month, in: query, required: true, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }, description: "AAAA-MM" }
      responses:
        '200': { description: Reporte del mes }
        '400': { description: Mes inválido }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Reportes]
      summary: Anotar la prorrata y la retención de tarjeta del mes (accounting.view)
      parameters:
        - { name: month, in: query, required: true, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }, description: "AAAA-MM" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prorata, cardWithholding]
              properties:
                prorata: { type: number, nullable: true, minimum: 0, maximum: 100, description: "% de crédito fiscal usable; null = no aplica (100 %)" }
                cardWithholding: { type: number, minimum: 0, description: Retenciones de IVA por ventas con tarjeta }
                note: { type: string, nullable: true, maxLength: 500 }
      responses:
        '200': { description: Lo guardado (VatPeriod) }
        '400': { description: Datos inválidos }
        '403': { $ref: '#/components/responses/Forbidden' }

  /reports/daily-summaries:
    get:
      tags: [Reportes]
      summary: Historial de resúmenes del día (reports.view)
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - { name: from, in: query, schema: { type: string, example: "2026-10-01" } }
        - { name: to, in: query, schema: { type: string, example: "2026-10-31" } }
        - { name: all, in: query, schema: { type: string, enum: ["1"] }, description: Todo el rango sin paginar (para descargar) }
      responses:
        "200": { description: "Página (o lista con all=1) de { id, date, data, text, generatedAt }" }

  /company/onboarding:
    get:
      tags: [Empresa]
      summary: Guía de primeros pasos (company.manage)
      description: |
        Pasos calculados con los datos reales: fiscal (datos para facturar), branch (dirección de la sucursal principal),
        categories, products, taxes (CABYS en todos y ninguno "por completar"; meta con lo que falta), team (otro miembro o una
        invitación), cashCodes (alguien con código de caja). Respuesta { steps: [{ key, link, done, meta? }], completed, total, dismissed }.
      responses:
        "200": { description: Estado de la guía }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [Empresa]
      summary: Ocultar (o volver a mostrar) la guía (company.manage)
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, properties: { dismissed: { type: boolean, default: true } } }
      responses:
        "200": { description: Estado de la guía }

  /platform/overview:
    get:
      tags: [Plataforma]
      summary: Actividad por empresa y empresas nuevas por semana (solo el dueño de la plataforma)
      description: "activity: lastSeenAt (último inicio o renovación de sesión), movementsWeek, lastMovementAt, salesMonth (neto de 30 días en la moneda de la empresa), ticketsMonth y registers (cajas activas). signups: 12 semanas."
      responses:
        "200": { description: Resumen }
        "403": { $ref: "#/components/responses/Forbidden" }

  /platform/ai-usage:
    get:
      tags: [Plataforma]
      summary: Medidor de consumo de IA del mes (solo el dueño)
      description: Gasto estimado (USD) por empresa y por función (CHAT, IMPORT, DAILY_SUMMARY), total, presupuesto y si la IA está en pausa.
      parameters:
        - { name: month, in: query, schema: { type: string, example: "2026-10" } }
      responses:
        "200": { description: Medidor }
        "403": { $ref: "#/components/responses/Forbidden" }

  /platform/ai-budget:
    put:
      tags: [Plataforma]
      summary: Presupuesto mensual de IA (solo el dueño)
      description: |
        Al llegar a alertPercent del presupuesto se avisa una vez al mes (notificación aiBudgetAlert); al pasarlo, toda
        consulta a Gemini responde 503 hasta el mes siguiente. 0 = IA apagada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [monthlyUsd, alertPercent]
              properties:
                monthlyUsd: { type: number, minimum: 0 }
                alertPercent: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200": { description: Presupuesto guardado }
        "403": { $ref: "#/components/responses/Forbidden" }

  /platform/actions:
    get:
      tags: [Plataforma]
      summary: Registro de acciones del dueño desde el panel (planes, suspensiones, presupuesto de IA)
      responses:
        "200": { description: Últimas 100 acciones }
        "403": { $ref: "#/components/responses/Forbidden" }

  /payables:
    get:
      tags: [Cuentas por pagar]
      summary: Proveedores con saldo, lo vencido primero (payables.manage, paginado)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Q'
        - { name: overdue, in: query, schema: { type: string, enum: ['1', '0'] }, description: "1 = solo con facturas vencidas" }
      responses:
        '200': { description: "{ items: [{ supplier, balance, overdue, invoices, nextDue, aging }], total, page, pageSize, totals: { balance, overdue, aging } }; aging = { current, d30, d60, d90, over90 } por días de atraso" }
        '403': { $ref: '#/components/responses/Forbidden' }

  /payables/invoices:
    get:
      tags: [Cuentas por pagar]
      summary: Facturas de proveedores (abiertas por defecto, las que vencen primero arriba)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Q'
        - { name: status, in: query, schema: { type: string, enum: [open, overdue, paid, void], default: open } }
        - { name: supplierId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: "{ items: [SupplierInvoice + supplier { id, name }], total, page, pageSize }" }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Cuentas por pagar]
      summary: Registrar una factura suelta o de una orden ya recibida
      description: "IVA por tarifa (lines): subtotal = suma de bases, tax = suma de IVA (sin tax en una fila = base × tarifa). creditable false = no da crédito fiscal. Sin dueDate = issueDate + días de crédito del proveedor. El número no se repite por proveedor entre las vigentes."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [supplierId, number, issueDate, lines]
              properties:
                supplierId: { type: string, format: uuid }
                purchaseOrderId: { type: string, format: uuid, description: "Debe ser del mismo proveedor" }
                number: { type: string, maxLength: 50 }
                issueDate: { type: string, format: date }
                dueDate: { type: string, format: date }
                lines: { $ref: '#/components/schemas/InvoiceTaxLines' }
                creditable: { type: boolean, default: true }
                note: { type: string, maxLength: 200 }
      responses:
        '201': { description: Factura registrada }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Proveedor u orden no encontrados }

  /payables/invoices/{id}/void:
    post:
      tags: [Cuentas por pagar]
      summary: Anular una factura mal registrada (solo sin pagos; libera el número)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string, maxLength: 200 } } }
      responses:
        '200': { description: Factura anulada }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { description: Factura no encontrada }

  /payables/payments:
    post:
      tags: [Cuentas por pagar]
      summary: Registrar un pago a un proveedor
      description: "Se aplica a las facturas abiertas de la que vence primero a la última (o solo a invoiceIds). reference obligatoria salvo en efectivo; no puede superar el saldo. No toca la caja. Devuelve el pago con allocations [{ amount, invoice { id, number } }]."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [supplierId, amount, method]
              properties:
                supplierId: { type: string, format: uuid }
                amount: { type: number }
                method: { type: string, enum: [CASH, CARD, SINPE, TRANSFER, OTHER] }
                reference: { type: string, maxLength: 60 }
                paidAt: { type: string, format: date, description: "Por defecto hoy" }
                note: { type: string, maxLength: 200 }
                invoiceIds: { type: array, items: { type: string, format: uuid } }
                bankAccountId: { type: string, format: uuid, description: "De qué cuenta salió (no aplica en efectivo); activa y de la empresa" }
      responses:
        '201': { description: Pago registrado }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { description: Proveedor no encontrado }

  /payables/{id}:
    get:
      tags: [Cuentas por pagar]
      summary: Estado de cuenta con un proveedor (id del proveedor)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: "{ supplier, balance, overdue, invoices (últimas 100, con anuladas), payments (últimos 50, con allocations y user) }" }
        '404': { description: Proveedor no encontrado }

  /banks/accounts:
    get:
      tags: [Bancos]
      summary: Cuentas bancarias (banks.manage o cash.reconcile)
      responses:
        '200': { description: "[{ id, name, bankName, number, currency, isActive, general, locations [{ id, name }], pending }]; general = recibe el SINPE y la tarjeta de la empresa; pending = movimientos por revisar" }
    post:
      tags: [Bancos]
      summary: Crear una cuenta (banks.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BankAccountInput' }
      responses:
        '201': { description: Cuenta creada }
        '400': { $ref: '#/components/responses/BadRequest' }

  /banks/accounts/{id}:
    put:
      tags: [Bancos]
      summary: Editar una cuenta (banks.manage)
      description: "Las sucursales que la tenían y ya no vienen en locationIds vuelven a la cuenta de la empresa. Inactiva = no recibe nada. Con movimientos no cambia de moneda."
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BankAccountInput' }
      responses:
        '200': { description: Cuenta guardada }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { description: Cuenta no encontrada }

  /banks/accounts/{id}/import:
    post:
      tags: [Bancos]
      summary: Importar el estado del banco (banks.manage)
      description: "El navegador lee el CSV o Excel y manda las filas. amount con signo (+ entra, − sale). Lo ya importado (misma fecha, referencia, monto y descripción) no se duplica."
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName, rows]
              properties:
                fileName: { type: string }
                rows:
                  type: array
                  maxItems: 5000
                  items:
                    type: object
                    required: [date, description, amount]
                    properties:
                      date: { type: string, format: date }
                      reference: { type: string, maxLength: 60 }
                      description: { type: string, maxLength: 300 }
                      amount: { type: number, description: "Distinto de 0" }
      responses:
        '201': { description: "{ rows, inserted, duplicates, dateFrom, dateTo }" }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { description: Cuenta no encontrada o inactiva }

  /banks/accounts/{id}/transactions:
    get:
      tags: [Bancos]
      summary: Movimientos importados de una cuenta, lo más nuevo primero (banks.manage)
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Q'
        - { name: status, in: query, schema: { type: string, enum: [pending, reviewed, all], default: pending } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: "{ items, total, page, pageSize, totals: { credits, debits } } (totales del filtro)" }

  /banks/transactions/{id}:
    patch:
      tags: [Bancos]
      summary: Clasificar un movimiento sin pareja en el sistema (null = quitar la clasificación)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category]
              properties:
                category: { type: string, nullable: true, enum: [BANK_FEE, INTEREST, OWNER_WITHDRAWAL, OWNER_CONTRIBUTION, EXPENSE, OTHER_INCOME, OTHER] }
                note: { type: string, maxLength: 200 }
      responses:
        '200': { description: Movimiento clasificado }
        '404': { description: Movimiento no encontrado }

  /banks/accounts/{id}/reconcile:
    get:
      tags: [Bancos]
      summary: Sugerencias de conciliación para lo pendiente del banco (banks.manage)
      description: |
        Lo que el sistema espera en la cuenta: SINPE/transferencias de ventas (+) y reembolsos de devoluciones (−),
        abonos de clientes, pagos a proveedores (−), depósitos de efectivo y la tarjeta de cada día (CARD_BATCH).
        La cuenta de cada cobro es la de su sucursal o la de la empresa. Pareja = monto exacto y fecha ±3 días
        (la referencia gana); tarjeta = entra 0–5 días después y hasta 10 % menos (comisión). Nada se concilia solo.
        missing = lo del sistema en el rango que ya pasó el plazo y no tiene pareja.
      parameters:
        - $ref: '#/components/parameters/Id'
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date }, description: "Rango de hasta 3 meses" }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { description: "{ items: [{ id, date, amount, reference, description, suggestion, candidates }] (una página), total, page, pageSize, pageCount, suggested (con pareja sugerida en todo el rango), missing: [item] }; item = { type, id, date, amount (con signo), reference, label }" }
        '404': { description: Cuenta no encontrada }

  /banks/transactions/{id}/match:
    post:
      tags: [Bancos]
      summary: Confirmar con qué del sistema concilia un movimiento del banco
      description: "La suma tiene que dar exacto, salvo con lotes de tarjeta: lo que falta (hasta 10 %) queda en fee como comisión. Cada cosa del sistema se concilia una sola vez."
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [type, id]
                    properties:
                      type: { type: string, enum: [SALE_PAYMENT, CUSTOMER_PAYMENT, SUPPLIER_PAYMENT, CASH_DEPOSIT, CARD_BATCH] }
                      id: { type: string, description: "Id del pago/depósito; CARD_BATCH = <cuenta>:<AAAA-MM-DD>" }
      responses:
        '200': { description: "Movimiento con matches y fee" }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { description: Movimiento no encontrado }
    delete:
      tags: [Bancos]
      summary: Deshacer la conciliación o la clasificación (vuelve a pendiente)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Movimiento pendiente otra vez }
        '404': { description: Movimiento no encontrado }

  /banks/deposits:
    get:
      tags: [Bancos]
      summary: Depósitos de efectivo (banks.manage o cash.reconcile)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Q'
        - { name: bankAccountId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: "{ items: [CashDeposit + bankAccount, location, user], total, page, pageSize }" }
    post:
      tags: [Bancos]
      summary: Registrar un depósito del efectivo de las cajas (banks.manage o cash.reconcile)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bankAccountId, amount, depositedAt, reference]
              properties:
                bankAccountId: { type: string, format: uuid }
                locationId: { type: string, format: uuid }
                amount: { type: number }
                depositedAt: { type: string, format: date }
                reference: { type: string, maxLength: 60 }
                note: { type: string, maxLength: 200 }
      responses:
        '201': { description: Depósito registrado }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { description: Cuenta o sucursal no encontrada }

  /customers:
    get:
      tags: [Clientes]
      summary: Listar clientes activos
      description: "Sin `page`: lista completa (la usan los selectores). Con `page`: paginado. q busca por nombre, correo o inicio de la identificación."
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Q'
      responses:
        '200':
          description: Lista completa o página
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { $ref: '#/components/schemas/Customer' }
                  - allOf:
                      - $ref: '#/components/schemas/PageMeta'
                      - type: object
                        properties:
                          items: { type: array, items: { $ref: '#/components/schemas/Customer' } }
    post:
      tags: [Clientes]
      summary: Registrar cliente (customers.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerInput' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /customers/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Clientes]
      summary: Ver un cliente
      responses:
        '200':
          description: Cliente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Clientes]
      summary: Editar cliente (customers.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerInput' }
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '400': { $ref: '#/components/responses/BadRequest' }
    delete:
      tags: [Clientes]
      summary: Borrar cliente (products.manage). Soft delete; los comprobantes emitidos lo siguen referenciando
      responses:
        '204': { description: Borrado }
        '403': { $ref: '#/components/responses/Forbidden' }

  /product-groups:
    get:
      tags: [Productos base]
      summary: Listar productos base (con cuántas variantes tienen)
      responses:
        '200':
          description: Productos base
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ProductGroup' } }
    post:
      tags: [Productos base]
      summary: Crear producto base (products.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductGroupInput' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductGroup' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /product-groups/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [Productos base]
      summary: Editar producto base (products.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductGroupInput' }
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductGroup' }
        '400': { $ref: '#/components/responses/BadRequest' }
    delete:
      tags: [Productos base]
      summary: Borrar producto base (products.manage). Sus variantes quedan como productos sueltos (conservan sus atributos)
      responses:
        '204': { description: Borrado }

  /suppliers:
    get:
      tags: [Proveedores]
      summary: Listar proveedores
      description: "Sin `page`: lista completa (la usan los selectores). Con `page`: paginado. q busca por nombre, correo o inicio de la identificación. Cada proveedor trae _count.products."
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Q'
      responses:
        '200':
          description: Lista completa o página
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { $ref: '#/components/schemas/Supplier' }
                  - allOf:
                      - $ref: '#/components/schemas/PageMeta'
                      - type: object
                        properties:
                          items: { type: array, items: { $ref: '#/components/schemas/Supplier' } }
    post:
      tags: [Proveedores]
      summary: Crear proveedor (suppliers.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplierInput' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Supplier' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /suppliers/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Proveedores]
      summary: Ver un proveedor
      responses:
        '200':
          description: Proveedor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Supplier' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Proveedores]
      summary: Editar proveedor (suppliers.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplierInput' }
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Supplier' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Proveedores]
      summary: Eliminar proveedor (suppliers.manage)
      description: 400 si tiene productos activos u órdenes de compra.
      responses:
        '200': { description: Eliminado }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- Solicitudes de compra
  /purchase-requests:
    get:
      tags: [Solicitudes de compra]
      summary: Listar solicitudes (paginado)
      description: "ADMIN ve todas; EMPLOYE solo las suyas. `q` busca en el producto y en quién pidió."
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Q'
        - name: status
          in: query
          schema: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        - name: unlinked
          in: query
          description: "Aprobadas que todavía no están en una orden"
          schema: { type: string, enum: ['1', 'true'] }
      responses:
        '200':
          description: Página de solicitudes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/PurchaseRequest' } }
    post:
      tags: [Solicitudes de compra]
      summary: Crear solicitud (cualquier usuario)
      description: Aprobarla no sube stock; solo autoriza la compra.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseRequestInput' }
      responses:
        '201':
          description: Creada (estado PENDING)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /purchase-requests/alerts:
    get:
      tags: [Solicitudes de compra]
      summary: Alertas de solicitudes (purchases.manage)
      responses:
        '200':
          description: Por vencer, aprobadas sin orden y productos por vencer
          content:
            application/json:
              schema:
                type: object
                properties:
                  expiringSoon:
                    type: array
                    items: { $ref: '#/components/schemas/PurchaseRequest' }
                  approvedUnfulfilled:
                    type: array
                    items: { $ref: '#/components/schemas/PurchaseRequest' }
                  expiringSoonProducts:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /purchase-requests/{id}/status:
    patch:
      tags: [Solicitudes de compra]
      summary: Aprobar o rechazar (purchases.manage)
      description: Avisa a quien la pidió (campanita + socket) si el estado cambió.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseRequestStatusInput' }
      responses:
        '200':
          description: Solicitud actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /purchase-requests/{id}/comments:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Comentarios]
      summary: Hilo de comentarios de una solicitud
      description: Quien pidió la solicitud y los ADMIN. Otro empleado recibe 404.
      responses:
        '200':
          description: Comentarios en orden cronológico
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Comment' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Comentarios]
      summary: Comentar en una solicitud
      description: Avisa a los ADMIN activos y a quien la pidió (menos al autor). Sin edición ni borrado.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentInput' }
      responses:
        '201':
          description: Comentario creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Órdenes de compra
  /purchase-requests/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Solicitudes de compra]
      summary: Ver una solicitud (para los enlaces ?highlight=)
      description: El empleado solo puede ver las suyas (otra → 404).
      responses:
        '200':
          description: Solicitud
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /purchase-orders:
    get:
      tags: [Órdenes de compra]
      summary: Listar órdenes (purchases.manage, paginado)
      description: "`q` busca por nombre del proveedor o por el inicio del id (N.º de orden)."
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Q'
        - name: status
          in: query
          schema: { type: string, enum: [PENDING, RECEIVED, CANCELLED] }
        - name: supplierId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Página de órdenes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/PurchaseOrder' } }
    post:
      tags: [Órdenes de compra]
      summary: Crear orden (purchases.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseOrderInput' }
      responses:
        '201':
          description: Creada (estado PENDING)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /purchase-orders/{id}:
    get:
      tags: [Órdenes de compra]
      summary: Ver una orden (purchases.manage)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Orden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '404': { $ref: '#/components/responses/NotFound' }

  /purchase-orders/{id}/receive:
    patch:
      tags: [Órdenes de compra]
      summary: Recibir todo o una parte (purchases.manage)
      description: |
        Recepción en partes: `items` = lo que llegó de cada línea (sin cuerpo, todo lo pendiente). Cada parte entra a la
        ubicación de la orden con movimientos IN, recalcula el costo promedio y avisa a quien pidió esos productos.
        La orden queda PARTIAL hasta completarse (RECEIVED). Solo con la orden PENDING o PARTIAL.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [itemId, quantity]
                    properties:
                      itemId: { type: string, format: uuid }
                      quantity: { type: number, minimum: 0, description: No más de lo que falta }
                      lot: { $ref: '#/components/schemas/LotInput' }
                invoice:
                  description: "Factura del proveedor (Cuentas por pagar), opcional. Sin lines se arman con lo que llega (costo de la orden por la tarifa de cada producto); sin dueDate = issueDate + días de crédito del proveedor. Número repetido del proveedor = 400 y no se recibe nada."
                  type: object
                  required: [number, issueDate]
                  properties:
                    number: { type: string, maxLength: 50 }
                    issueDate: { type: string, format: date }
                    dueDate: { type: string, format: date }
                    lines: { $ref: '#/components/schemas/InvoiceTaxLines' }
                    creditable: { type: boolean, default: true }
                    note: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Orden con lo recibido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /purchase-orders/{id}/cancel:
    post:
      tags: [Órdenes de compra]
      summary: Cancelar una orden sin nada recibido (purchases.manage)
      description: Las solicitudes vinculadas vuelven a quedar aprobadas sin orden. Si ya llegó algo, se cierra.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 300 }
      responses:
        '200':
          description: Cancelada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /purchase-orders/{id}/close:
    post:
      tags: [Órdenes de compra]
      summary: Cerrar una orden recibida en parte (purchases.manage)
      description: El proveedor ya no trae el resto; lo recibido queda y lo pendiente se cancela.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 300 }
      responses:
        '200':
          description: Cerrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /purchase-orders/{id}/send-email:
    post:
      tags: [Órdenes de compra]
      summary: Enviar (o reenviar) la orden al email del proveedor (purchases.manage)
      description: |
        Usa Resend. Sin `EMAIL_FROM` configurado (sin dominio verificado) funciona en **modo prueba**:
        el correo va a `EMAIL_TEST_TO` y el asunto indica el destinatario real.
        Falla con 400 si el proveedor no tiene email o falta el nombre de la empresa.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Enviado
          content:
            application/json:
              schema:
                type: object
                properties:
                  order: { $ref: '#/components/schemas/PurchaseOrder' }
                  testMode: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /purchase-orders/{id}/comments:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Comentarios]
      summary: Hilo de comentarios de una orden (purchases.manage)
      responses:
        '200':
          description: Comentarios en orden cronológico
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Comment' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Comentarios]
      summary: Comentar en una orden (purchases.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentInput' }
      responses:
        '201':
          description: Comentario creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- Notificaciones
  /notifications:
    get:
      tags: [Notificaciones]
      summary: Avisos de la campanita
      description: |
        ADMIN: avisos calculados (stock bajo, por vencer, pendientes, aprobadas sin orden) + sus avisos guardados.
        EMPLOYE: solo sus avisos guardados. Los calculados siempre cuentan como no leídos.
      responses:
        '200':
          description: Avisos
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  unread: { type: integer }
                  notifications:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }

  /notifications/read-all:
    patch:
      tags: [Notificaciones]
      summary: Marcar todos mis avisos guardados como leídos
      responses:
        '200':
          description: Cantidad marcada
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: integer }

  /notifications/{id}/read:
    patch:
      tags: [Notificaciones]
      summary: Marcar un aviso guardado como leído
      description: Solo afecta avisos del propio usuario (`updated` = 0 si es ajeno o ya estaba leído).
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Cantidad marcada
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: integer }

  # ---------------------------------------------------------------- Reportes
  /reports/dashboard:
    get:
      tags: [Reportes]
      summary: Totales del panel calculados en el servidor (reports.view)
      description: Las solicitudes respetan el rol (el empleado cuenta solo las suyas).
      parameters:
        - name: since
          in: query
          description: Inicio del mes en la zona del navegador (por defecto, el del servidor)
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Totales
          content:
            application/json:
              schema:
                type: object
                properties:
                  units: { type: number, description: Unidades en stock (suma de todos los productos) }
                  dispatchedSince: { type: number, description: Salidas (OUT) desde since }
                  stockByCategory: { type: array, items: { type: object, properties: { name: { type: string }, value: { type: number } } } }
                  recentMovements: { type: array, items: { $ref: '#/components/schemas/Movement' } }
                  requests: { type: object, additionalProperties: { type: integer }, example: { PENDING: 2, APPROVED: 1 } }

  /reports/low-stock:
    get:
      tags: [Reportes]
      summary: Productos con stock en o bajo el mínimo (reports.view)
      responses:
        '200':
          description: Productos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Product' }

  /reports/movements:
    get:
      tags: [Reportes]
      summary: Movimientos por rango de fechas (reports.view)
      description: Días completos en la hora del servidor; to incluye todo ese día.
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Movimientos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Movement' }
        '400': { description: Fecha con formato inválido (AAAA-MM-DD) }

  /reports/inventory-value:
    get:
      tags: [Reportes]
      summary: Valor del inventario a costo (reports.view + costs.view)
      description: |
        `totalValue` = stock × costo promedio de los productos activos (lo que hay invertido).
        Los productos con stock y sin costo no suman: se cuentan en `productsWithoutCost`.
      responses:
        '200':
          description: Totales
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalValue: { type: number, description: Valor a costo }
                  retailValue: { type: number, description: "Valor a precio de venta (referencia)" }
                  totalProducts: { type: integer }
                  productsWithoutCost: { type: integer, description: Productos con stock y sin costo cargado }

  /reports/inventory-value-breakdown:
    get:
      tags: [Reportes]
      summary: Capital activo vs. inmovilizado (a costo) (reports.view + costs.view)
      parameters:
        - name: days
          in: query
          description: Días sin movimiento para considerar un producto inmovilizado
          schema: { type: integer, default: 60 }
      responses:
        '200':
          description: Desglose
          content:
            application/json:
              schema:
                type: object
                properties:
                  daysThreshold: { type: integer }
                  totalValue: { type: number }
                  activeValue: { type: number }
                  immobilizedValue: { type: number }
                  productsWithoutCost: { type: integer }
                  immobilizedProducts:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        sku: { type: string }
                        name: { type: string }
                        value: { type: number, description: Valor a costo (0 si no tiene costo) }
                        hasCost: { type: boolean }

  /reports/stock-forecast:
    get:
      tags: [Reportes]
      summary: Pronóstico de agotamiento según el ritmo de ventas (reports.view)
      parameters:
        - name: velocityDays
          in: query
          description: Ventana para calcular las ventas diarias
          schema: { type: integer, default: 30 }
        - name: alertDays
          in: query
          description: Umbral de días restantes para marcarlo urgente
          schema: { type: integer, default: 14 }
      responses:
        '200':
          description: Pronóstico
          content:
            application/json:
              schema:
                type: object
                properties:
                  velocityWindowDays: { type: integer }
                  forecast:
                    type: array
                    items:
                      type: object
                      properties:
                        productId: { type: string, format: uuid }
                        productName: { type: string }
                        currentStock: { type: integer }
                        dailyVelocity: { type: number }
                        daysRemaining: { type: number, nullable: true }
                        willRunOutSoon: { type: boolean }
                  urgent:
                    type: array
                    items: { type: object, additionalProperties: true }

  # ---------------------------------------------------------------- Auditoría
  /audit-logs:
    get:
      tags: [Auditoría]
      summary: Registro de auditoría (audit.view, paginado)
      description: "`q` busca por nombre de usuario o por el inicio del id de la entidad."
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Q'
        - name: entityType
          in: query
          schema: { type: string, example: PurchaseOrder }
        - name: action
          in: query
          description: "Ej.: EMAIL para ver solo los correos enviados a proveedores"
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Página del registro
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageMeta' }
  /audit-logs/metrics:
    get:
      tags: [Auditoría]
      summary: Métricas de auditoría (audit.view)
      responses:
        '200':
          description: Métricas
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalCount: { type: integer }
                  byAction:
                    type: array
                    items:
                      type: object
                      properties:
                        action: { type: string }
                        count: { type: integer }
                  byEntityType:
                    type: array
                    items:
                      type: object
                      properties:
                        entityType: { type: string }
                        count: { type: integer }
                  recentActivity:
                    type: array
                    description: Fechas de cada acción de los últimos 7 días (el cliente las agrupa por día local)
                    items: { type: string, format: date-time }
                  emails:
                    type: object
                    properties:
                      total: { type: integer }
                      testMode: { type: integer }
                      last:
                        type: object
                        nullable: true
                        properties:
                          createdAt: { type: string, format: date-time }
                          changes:
                            type: object
                            properties:
                              to: { type: string }
                              testMode: { type: boolean }
                          user:
                            type: object
                            properties:
                              name: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- Asistente
  /assistant/chat:
    post:
      tags: [Asistente]
      summary: Preguntar al asistente IA (solo lectura; reports.view)
      description: Usa Gemini con herramientas de consulta; nunca crea, edita ni borra datos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '200':
          description: Respuesta del asistente
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
