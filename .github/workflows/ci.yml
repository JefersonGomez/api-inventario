# Integración continua de la API: en cada push y pull request revisa tipos, corre los tests contra un
# Postgres temporal, valida el openapi.yaml y comprueba que la imagen de Docker se construye.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# si llegan dos pushes seguidos a la misma rama, se cancela la corrida vieja
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Postgres de usar y tirar: GitHub lo crea para esta corrida y lo borra al terminar
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inventario_db_test # resetDb() exige que el nombre termine en _test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # valores solo de prueba (no son secretos: la base existe unos minutos dentro de la corrida)
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inventario_db_test
      JWT_SECRET_KEY: clave-solo-para-la-ci-de-github-actions
      TZ: America/Costa_Rica
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm # guarda la caché de npm entre corridas: la instalación tarda mucho menos

      - name: Instalar dependencias
        run: npm ci

      - name: Generar el cliente de Prisma
        run: npx prisma generate

      - name: Aplicar las migraciones a la base de prueba
        run: npx prisma migrate deploy

      - name: Revisar tipos (TypeScript)
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Validar openapi.yaml
        run: npx --yes @redocly/cli@1.34.0 lint openapi.yaml

  docker:
    # la imagen se construye sin publicarla: solo comprueba que el Dockerfile sigue funcionando
    # (publicarla y desplegar es el paso siguiente, CD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construir la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- CD: solo en push a main y si todo lo de arriba pasó ----------

  publish:
    # sube la imagen a GitHub Container Registry con dos etiquetas: "latest" y el commit exacto
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # el GITHUB_TOKEN de esta corrida puede publicar en ghcr.io
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # el nombre en ghcr.io va en minúsculas
          tags: |
            ghcr.io/jefersongomez/stockly-api:latest
            ghcr.io/jefersongomez/stockly-api:${{ github.sha }}
          cache-from: type=gha # reutiliza lo que ya construyó el job "docker"

  deploy:
    # entra por SSH a la VPS, actualiza los archivos de deploy/, baja la imagen nueva y reinicia
    needs: publish
    runs-on: ubuntu-latest
    environment: production # aparece en la pestaña "Deployments" del repo con su historial
    steps:
      - uses: actions/checkout@v4
      - name: Preparar la llave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # ponytail: confía en la huella de la VPS al primer contacto; para más seguridad, guardarla en un secret
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
      - name: Copiar docker-compose, Caddyfile y el script de respaldo
        run: scp deploy/docker-compose.prod.yml deploy/Caddyfile deploy/backup.sh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/stockly/"
      - name: Actualizar los contenedores
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
            set -e
            cd /opt/stockly
            chmod +x backup.sh
            docker compose -f docker-compose.prod.yml pull api
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
          '
