# Stockly en producción: base de datos, API, frontend y Caddy (HTTPS) en una sola máquina.
# Uso (en la VPS, en esta carpeta, con el archivo .env al lado):
#   docker compose -f docker-compose.prod.yml up -d
# Las imágenes las construye GitHub Actions; en tu computadora se pueden construir a mano (ver README.md).
name: stockly

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: stockly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: stockly
    volumes:
      - db_data:/var/lib/postgresql/data
    # sin "ports": la base NO se publica a internet; solo la ven los otros contenedores
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockly -d stockly"]
      interval: 5s
      retries: 10

  api:
    image: ${API_IMAGE:-stockly-api:local}
    restart: unless-stopped
    env_file: .env
    environment:
      # la dirección "db" es el nombre del servicio de arriba dentro de la red de Docker
      DATABASE_URL: postgresql://stockly:${POSTGRES_PASSWORD}@db:5432/stockly
      NODE_ENV: production
      PORT: 3000
      # proxies delante de la API: 1 = solo Caddy; 2 = nginx de la VPS + Caddy (la IP real viene en X-Forwarded-For)
      TRUST_PROXY: ${TRUST_PROXY:-1}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads # fotos de perfil: sobreviven a cada despliegue

  web:
    image: ${WEB_IMAGE:-stockly-web:local}
    restart: unless-stopped

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Falta SITE_ADDRESS en .env}
    # BIND_ADDRESS=127.0.0.1: el puerto solo se abre dentro de la máquina (lo usa el nginx de la VPS);
    # ojo: los puertos que publica Docker se saltan el firewall (ufw), por eso no se abren a todo el mundo
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificados HTTPS: si se pierden, Caddy los vuelve a pedir
    depends_on:
      - api
      - web

volumes:
  db_data:
  uploads:
  caddy_data:
