# Bloque de nginx para la VPS (nginx ya ocupa los puertos 80 y 443 con otros proyectos).
# nginx recibe stockly-jeferson.duckdns.org y se lo pasa al Caddy de Stockly, que escucha solo
# dentro de la máquina (127.0.0.1:8080) y reparte /api → api y lo demás → web.
# El HTTPS lo pone certbot sobre este mismo archivo (agrega las líneas "listen 443 ssl" y el certificado).
# Va en /etc/nginx/sites-available/stockly con un enlace en sites-enabled.
server {
    listen 80;
    listen [::]:80;
    server_name stockly-jeferson.duckdns.org;

    client_max_body_size 10m; # fotos de perfil e importación de Excel

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # tiempo real (socket.io usa WebSocket)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
